name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/prisonblues/quarterback
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Without this job the build half runs and nothing ever rolls out — which is
  # exactly what happened to v2.7 (built, then sat undeployed for two weeks).
  # The webhook redeploys Portainer stack `quarterback`; migrations run on boot
  # from the stack's own entrypoint, so no post-deploy command is needed.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via webhook
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{}' \
            "https://hooks.fo.ls/hooks/ee02824e-13fc-4f62-b522-818fb1221969/deploy-quarterback" \
            || { echo "Failed to trigger deploy"; exit 1; }
          echo "Deploy triggered successfully"

      # Announce the commit on the quarterback board so peers learn their checkout
      # went stale. The lifecycle hook covers a local `git push`, but a PR merged
      # on GitHub is nobody's push — which is exactly how most work reaches main,
      # so without this the branch peers care about is the one never announced.
      # Best-effort: announcing is not worth failing a green deploy over.
      - name: Announce on the coordination board
        if: ${{ secrets.QUARTERBACK_TOKEN != '' }}
        continue-on-error: true
        env:
          QUARTERBACK_TOKEN: ${{ secrets.QUARTERBACK_TOKEN }}
          # Via env, never inlined into the script: a commit message is attacker-
          # controlled text and `${{ }}` interpolation would make it executable.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          summary=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-120)
          [ -n "$summary" ] || summary="pushed ${COMMIT_SHA:0:7}"
          body=$(jq -nc --arg s "$summary" --arg c "$COMMIT_SHA" --arg b "$BRANCH" \
            '{type:"published", summary:$s,
              refs:[{kind:"commit", value:$c, repo:"prisonblues/quarterback"},
                    {kind:"repo", value:"quarterback"},
                    {kind:"branch", value:$b}]}')
          curl -sf --max-time 10 -X POST "https://qb.fo.ls/post" \
            -H "Authorization: Bearer $QUARTERBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$body" \
            && echo "Announced ${COMMIT_SHA:0:7} on the board" \
            || echo "Board announce failed (non-fatal)"
