name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/prisonblues/quarterback
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Without this job the build half runs and nothing ever rolls out — which is
  # exactly what happened to v2.7 (built, then sat undeployed for two weeks).
  # The webhook redeploys Portainer stack `quarterback`; migrations run on boot
  # from the stack's own entrypoint, so no post-deploy command is needed.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The hook URL is a secret, not a literal: its path segment is itself a
      # capability, so committing it publishes a live endpoint on the deploy host.
      # Unset (e.g. on a fork) ⇒ skip, so the build half still passes.
      - name: Trigger deploy via webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$DEPLOY_WEBHOOK_URL" ] || { echo "no deploy webhook configured; skipping"; exit 0; }
          # --max-time because the hook returns as soon as it has queued the
          # deploy, so this call is milliseconds when the edge is reachable and
          # hung when it isn't. Without a cap an unreachable edge burned two
          # minutes of CI before failing with the same message it gives instantly.
          curl -sf --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: $DEPLOY_TOKEN" \
            -d '{}' \
            "$DEPLOY_WEBHOOK_URL" \
            || { echo "Failed to trigger deploy"; exit 1; }
          echo "Deploy triggered successfully"

      # Announce the commit on the quarterback board so peers learn their checkout
      # went stale. The lifecycle hook covers a local `git push`, but a PR merged
      # on GitHub is nobody's push — which is exactly how most work reaches main,
      # so without this the branch peers care about is the one never announced.
      # Best-effort: announcing is not worth failing a green deploy over.
      # The "skip when unconfigured" guard is inside the script, not a step-level
      # `if:`: the `secrets` context is not available there, and referencing it
      # fails the WHOLE workflow at validation time — no jobs, no build, no deploy,
      # and a 0s "workflow file issue" run that says nothing about which line.
      - name: Announce on the coordination board
        continue-on-error: true
        env:
          QUARTERBACK_TOKEN: ${{ secrets.QUARTERBACK_TOKEN }}
          # Also a secret: the agent host is a private deployment, not a public API.
          QUARTERBACK_BASE_URL: ${{ secrets.QUARTERBACK_BASE_URL }}
          # Via env, never inlined into the script: a commit message is attacker-
          # controlled text and `${{ }}` interpolation would make it executable.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$QUARTERBACK_TOKEN" ] && [ -n "$QUARTERBACK_BASE_URL" ] \
            || { echo "board not configured; skipping"; exit 0; }
          summary=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-120)
          [ -n "$summary" ] || summary="pushed ${COMMIT_SHA:0:7}"
          body=$(jq -nc --arg s "$summary" --arg c "$COMMIT_SHA" --arg b "$BRANCH" --arg r "$REPO" \
            '{type:"published", summary:$s,
              refs:[{kind:"commit", value:$c, repo:$r},
                    {kind:"repo", value:($r|split("/")|last)},
                    {kind:"branch", value:$b}]}')
          curl -sf --max-time 10 -X POST "${QUARTERBACK_BASE_URL%/}/post" \
            -H "Authorization: Bearer $QUARTERBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$body" \
            && echo "Announced ${COMMIT_SHA:0:7} on the board" \
            || echo "Board announce failed (non-fatal)"
