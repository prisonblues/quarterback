name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/prisonblues/quarterback
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Without this job the build half runs and nothing ever rolls out — which is
  # exactly what happened to v2.7 (built, then sat undeployed for two weeks).
  # The webhook redeploys Portainer stack `quarterback`; migrations run on boot
  # from the stack's own entrypoint, so no post-deploy command is needed.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via webhook
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{}' \
            "https://hooks.example.com/hooks/DEPLOY_WEBHOOK_ID/deploy-quarterback" \
            || { echo "Failed to trigger deploy"; exit 1; }
          echo "Deploy triggered successfully"
