name: Tests

# Every push and every PR. The repo had no job running pytest at all — the only
# workflow built an image, pushed it and triggered the deploy — so a commit that
# broke every test shipped exactly like one that passed (#70).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Top level, so it covers every job rather than one of them. These jobs read the
# checkout and report; nothing here writes to the repository. Without this the
# workflow inherits whatever the repository's default token permissions are — a
# setting this file does not control, which an org or repo admin can widen without
# touching this file, and which would then apply to the two jobs that run arbitrary
# test code.
permissions:
  contents: read

jobs:
  app:
    name: app suite
    runs-on: ubuntu-latest
    # Every job here carries one. These suites run in seconds locally, so a run
    # that is still going after fifteen minutes is wedged rather than slow — and
    # the runner's default is six hours of silence before anyone finds out. The
    # SSE tests are the specific worry: one of them exists to prove /stream 401s
    # without auth, and the way that assertion fails is by hanging on a live
    # stream rather than by reporting.
    timeout-minutes: 15
    services:
      # The same image and credentials as docker-compose.yml, so a failure here
      # means the code, not a difference between CI's database and the one the
      # suite is developed against. Mapped to 5432 rather than compose's 5435:
      # that port only exists to avoid clashing with a developer's local
      # Postgres, and DATABASE_URL below names the port explicitly anyway.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: quarterback
          POSTGRES_PASSWORD: quarterback
          POSTGRES_DB: quarterback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quarterback"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the app suite
        env:
          # `dbtarget` takes an explicit DATABASE_URL ahead of the checkout's
          # .env, which is exactly what a runner needs — there is no .env here.
          DATABASE_URL: postgresql+asyncpg://quarterback:quarterback@localhost:5432/quarterback
          # The suite pins everything else the app reads, but this one has to be
          # empty explicitly: with it set, `reader` authenticates everybody and
          # the test asserting /stream 401s without auth instead gets a live SSE
          # stream and hangs until the job times out.
          BROWSER_DEV_USER: ""
        # `--extra dev`, the project's own declared group. A bare `uv run pytest`
        # works on a developer's machine only because their venv already has it,
        # and `--with pytest` would miss pytest-asyncio, which `asyncio_mode =
        # "auto"` needs. CI caught exactly this on its first run.
        run: uv run --extra dev pytest -q

  harness:
    name: harness suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # This job is the whole point. `pyproject.toml` sets `testpaths = ["tests"]`,
      # which deliberately keeps a bare `pytest` off harness/ — so these ~370
      # tests, the entire safety net for the reviewer panel, the epic driver and
      # the lander, ran only when a human remembered the path. A separate job
      # rather than a wider `testpaths` because they genuinely are separate
      # suites with their own conventions, and because none of them needs a
      # database: only the app suite does.
      #
      # DISCOVERED rather than listed, and it FAILS when it finds nothing. A
      # hardcoded path breaks the day a suite moves, and — worse — the obvious
      # repair is to let the step skip when the directory is missing, which is a
      # test job that quietly runs nothing and reports green. That is the exact
      # failure this repo is organised against; a suite that disappears has to
      # be as loud as a suite that fails.
      #
      # `-n auto`, one worker per core. This step ran on a single core for 68s of
      # every push while the runner's other three sat idle, and what dominates it
      # is not CPU: `test_nginx_block_regressions` alone is 20s of shelling out to
      # a 220-line bash suite that builds throwaway git repos, and four qb-seat
      # tests wait on a real tmux server (#233). Those are subprocess waits, so
      # they overlap across workers almost perfectly, and not one test is
      # shortened to get it — the tmux tests still drive tmux and the nginx test
      # still drives real git repositories, which is the whole of what they check.
      # Not in `addopts`: the flake's check sandboxes hold pytest and nothing
      # else, so a project-wide `-n` would fail every check in flake.nix with
      # "unrecognized arguments". The flag stays where xdist is installed.
      #
      # `-n` does not weaken the report. xdist prefixes a failure with the worker
      # that saw it ([gw2]) and prints the whole traceback in the summary, and the
      # per-suite loop below is still one pytest run per suite, so a red step still
      # names a suite, a module and a test.
      - name: Run every harness suite
        run: |
          set -euo pipefail
          mapfile -t suites < <(find harness -type d -name tests -not -path '*/node_modules/*' | sort)
          if [[ ${#suites[@]} -eq 0 ]]; then
            echo "::error::No test suites found under harness/ — they moved, or this job is now a no-op reporting green."
            exit 1
          fi
          printf 'running %d harness suite(s): %s\n' "${#suites[@]}" "${suites[*]}"
          for suite in "${suites[@]}"; do
            echo "--- $suite"
            uv run --extra dev pytest "$suite" -q -n auto
          done

      # TWICE, with different extras, for the reason the mcp job below runs
      # twice: the dependency posture is itself a claim. The run above is the
      # one that proves the harness needs no Textual — `qb-board --follow` and
      # every non-dashboard script must import neither it nor rich, and the way
      # that stays true is that the ordinary run does not have them.
      #
      # This run is the one where the dashboard tests EXECUTE. test_qb_dash.py
      # skips its whole module when textual is absent, and the `tui` extra lived
      # only in mcp/pyproject.toml — so those tests had never once run in CI.
      # Seven of them, green by never executing, on the file with the most
      # clicking-the-wrong-row ways to be wrong.
      #
      # THE DASHBOARD MODULES ONLY, and that narrowing is the other half of #233.
      # This step used to re-run every suite under harness/ before the check below,
      # which cost a further 74s per push to learn nothing: the tui extra changes
      # what these two modules do and changes nothing anywhere else, so the nginx
      # bash suite and the tmux seat tests were being paid for twice over. What
      # makes that safe to assume is that it is not assumed — tests/test_harness_job.py
      # scans every harness test module for a real textual/rich dependency and fails
      # if one of them is missing from the list below. Add a module that needs the
      # extra, forget this line, and that test is red rather than the module being
      # silently green by never running.
      - name: Run the dashboard suites with the dashboard's dependencies
        run: |
          set -euo pipefail
          # And loudly if the thing this step exists for skipped anyway. A module
          # that skips every test exits 0, so a green step is not evidence on its
          # own — that is exactly how the gap above went unnoticed. The tests that
          # want a live board and a `gh` still skip here and are meant to; these
          # are the ones whose data is a literal in the file.
          # BOTH dashboard suites, named one at a time. Each is skip-guarded on its
          # own dependency — test_qb_dash.py on textual, test_qb_dash_plain.py on
          # rich — so a single run over both would report `N passed` while one of
          # them contributed nothing, which is the reading this step exists to deny.
          # Serial, and not `-n auto` like the step above: this reads pytest's own
          # summary line back out, and it is forty-odd tests to begin with.
          for suite in harness/tests/test_qb_dash.py harness/tests/test_qb_dash_plain.py; do
            echo "--- did $suite actually run?"
            out=$(uv run --extra dev --extra tui pytest "$suite" -q -rs 2>&1)
            echo "$out"
            grep -qE '[0-9]+ passed' <<<"$out" || {
              echo "::error::$suite executed nothing. It is skipping under CI again — check its skip guard (_why_no_tui / importorskip) and the tui extra in pyproject.toml."
              exit 1
            }
          done

  mcp:
    name: mcp + board client
    runs-on: ubuntu-latest
    # See the app job. This one has the most ways to hang: the TUI tests drive a
    # Textual pilot with its own event loop, and the local-action tests run real
    # `git clone`/`fetch`. Neither has an internal deadline.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `python-version`: `uv run` picks an interpreter from the project's
      # own `requires-python`, which is the constraint that should decide it,
      # and pinning one here would be a fourth place the version is written.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # mcp/ had no CI job at all until the board client landed there (#110), so
      # the MCP server and the HTTP client every other piece of tooling talks to
      # the board through were the two things in this repo nothing tested. It is
      # its own project (mcp/pyproject.toml) with its own dependency set, hence a
      # third job rather than another path in one of the two above.
      #
      # TWICE, with different extras, because the claim being tested is a
      # dependency claim. The base install is httpx and nothing else — that is
      # what a headless host tailing the board actually gets — so the first run
      # is the one that proves the tail half imports no Textual and no MCP SDK.
      # Run only the second and `pytest.importorskip("textual")` is decoration:
      # the framework is always there, and nothing ever exercises its absence.
      - name: Run the mcp suite as a tail-only host has it
        run: |
          set -euo pipefail
          # git identity: the local-action tests build real repositories, because
          # every refusal they check is a claim about what git actually reports.
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          # Run from mcp/ so pytest's rootdir is that project and its own ini
          # applies — `asyncio_mode = "auto"`, without which every pilot-driven
          # test is skipped as an un-awaited coroutine and the job reports green.
          cd mcp
          uv run --extra dev pytest -q

      # Everything installed: the full-screen client, and the MCP SDK — without
      # which the guard asserting the board-client path never imports it has
      # nothing to catch, since an absent package is trivially unimported.
      - name: Run the mcp suite with every extra
        run: |
          set -euo pipefail
          cd mcp
          uv run --extra dev --extra tui --extra server pytest -q

  flake:
    name: flake checks
    runs-on: ubuntu-latest
    # Least privilege, and this job is the one in this file that most needs it: it
    # evaluates and BUILDS nix code that arrives with the pull request, through a
    # third-party action that runs before any code of ours. The SHA pin below covers
    # the action being repointed; it says nothing about what the token that action
    # holds can do. A repository whose default `GITHUB_TOKEN` is still read/write —
    # the common default — hands that write scope to a `flake.nix` written by whoever
    # opened the PR. Checkout is all this job needs.
    permissions:
      contents: read
    # The jobs above and this one do NOT run the same thing, and that is the
    # point rather than duplication (#179). They run `uv run pytest` against a
    # normal checkout; the flake runs the same suites inside a sandbox holding
    # only what `flake.nix` puts there. Each is blind where the other sees:
    # `test_release_numbers.py` passes above and errored on missing files in the
    # sandbox for a day (#163), and the qb-seats suite skips above because the
    # runner has no tmux, while the sandbox installs tmux precisely so that those
    # tests cannot skip. Until this job existed the flake's checks ran only when
    # a human typed `nix build`, which is how a red `main` went a day without
    # anyone noticing.
    #
    # For anyone wiring up branch protection: unlike `stamped` below, this job
    # runs on pull_request as well as push, so it is safe to require.
    #
    # Same fifteen minutes as the jobs above. No measurement is written down
    # here on purpose. Cold runs have come in around a minute end to end, but the
    # runner image, the nixpkgs pin and the check set all move independently, so
    # a number in a comment goes stale in silence and then misleads the next
    # reader about how much headroom actually remains. Fifteen minutes is an
    # order of magnitude clear of anything observed, which is what a timeout is
    # for: it catches a wedged run, not a slow one.
    #
    # No nix store cache, deliberately. `magic-nix-cache-action` was sunset,
    # `cachix-action` wants a token this repo does not have, and `actions/cache`
    # over /nix/store restores more slowly than cache.nixos.org serves a closure
    # this size. If the check set ever grows enough to flip that trade, the
    # timeout above is the thing that says so.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the commit behind v31.11.1, not the mutable `v31` tag. This is
      # third-party and runs before any code of ours, so a repointed tag would
      # execute here holding the job's token. `actions/checkout` above has the
      # same tag shape but is first-party, which is why the pin starts here.
      # Bump the SHA and the trailing comment together.
      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Asserted by tests/test_flake_workflow.py: without these two features
          # every `nix` invocation below fails on a runner whose nix.conf has
          # neither, and the job's failure names the config rather than the flake.
          extra_nix_config: |
            experimental-features = nix-command flakes
          # Flake inputs are `github:` refs, and the installer fetches its own
          # release metadata the same way. Unauthenticated, both share the runner
          # IP's 60 requests/hour with every other job on that host, and the cost
          # lands squarely here: the deliberate absence of a nix store cache
          # (reasoned about above) means this job re-fetches on every single run.
          # The symptom is an intermittent `HTTP 403: rate limit exceeded` that has
          # nothing to do with the diff — and a required check that fails for
          # reasons the PR did not cause is one reviewers learn to re-run without
          # reading, which is worse than not having it.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # DISCOVERED and not listed, and it FAILS when it finds nothing — the same
      # rule as the harness job above, for a sharper reason: `nix flake check` on
      # a flake whose checks have been removed exits 0. A job that only ran that
      # would go green the day the checks disappear, which is precisely the
      # failure this job exists to end. Naming them also puts the set in the log,
      # so a reviewer can see a new check is actually being run rather than
      # assume it: #163's `release-metadata-tests` was added because the old
      # arrangement ran eight assertions that had never once been evaluated.
      #
      # Be clear about the floor this guard sets: it is name-level. It catches
      # the checks being emptied or the whole output being deleted. It cannot
      # catch a check that keeps its name and loses its body — swap one for
      # `pkgs.emptyFile` and the count is unchanged and the log still reads
      # reassuringly. The guard against THAT is not here but in
      # tests/test_flake_workflow.py, which pins the expected set of names
      # against flake.nix so that adding, renaming or dropping a check is a
      # deliberate, reviewer-visible diff rather than a silent one.
      #
      # The system is derived, not written down. A hardcoded x86_64-linux is
      # wrong the day this moves to an arm runner, and the same lesson landed
      # twice in this repo already (#148, #176).
      - name: Name the checks
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          # Caught rather than left to `set -e`. If `checks` — or `checks.$system`
          # — has been deleted from flake.nix outright instead of emptied, the
          # eval itself is what fails, and an uncaught failure would end this job
          # on a raw nix error before the annotation below could fire. That
          # annotation is the entire purpose of the step, so this reads the same
          # to a human whether the checks were emptied or removed.
          #
          # stderr to a file rather than folded in with `2>&1`: nix writes to it
          # on the SUCCESS path too — "warning: Git tree is dirty" is the common
          # one — and merging that into the capture hands jq a JSON document with
          # a line of English glued to the front of it.
          eval_err=$(mktemp)
          if ! names=$(nix eval ".#checks.$system" --apply 'cs: builtins.attrNames cs' --json 2>"$eval_err"); then
            echo "::error::flake.nix declares no checks for $system — \`checks.$system\` could not be evaluated at all, so it was removed or renamed rather than emptied. nix said: $(tr '\n' ' ' <"$eval_err")"
            exit 1
          fi
          # Caught, for the same reason the eval above is. `set -e` would end the
          # step here on a bare jq message — no jq on the runner, or a `names` that
          # is not a well-formed JSON array — and the annotation is the entire
          # purpose of this step, so every way the names can fail to arrive has to
          # produce one. A step that dies silently reports the same as a check set
          # that vanished, which is the confusion this job exists to remove.
          if ! count=$(jq 'length' <<<"$names" 2>/dev/null); then
            echo "::error::the flake's check names could not be counted — \`nix eval\` returned something that is not a JSON array, or jq is missing from this runner. nix returned: $(tr -d '\r' <<<"$names" | tr '\n' ' ' | head -c 300)"
            exit 1
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "::error::flake.nix declares no checks for $system — they were removed, or this job is now a no-op reporting green."
            exit 1
          fi
          # Assigned on its own line rather than substituted into the printf. A
          # jq that fails inside `$(...)` in printf's argument list still leaves
          # printf exiting 0, so `set -e` never sees it and the job carries on
          # reporting an empty set of names as though it had found none.
          #
          # `map(@json)` and not a bare `join`, because these names are attribute
          # names out of the pull request's own flake.nix and this line goes into a
          # log that Actions PARSES: a line beginning `::` is a workflow command, so
          # a check named with an embedded newline and `::error::` forges an
          # annotation — or `::add-mask::`, or an `::error::` claiming the opposite
          # of what happened. @json renders each name as a JSON string literal, so a
          # newline arrives as the two characters `\n` and no name can ever start a
          # line. The quotes are a readability gain as well: an empty or
          # space-padded name is visible instead of invisible.
          if ! joined=$(jq -r 'map(@json) | join(", ")' <<<"$names" 2>/dev/null); then
            echo "::error::the flake's check names could not be rendered for the log, though $count of them were counted — jq failed on a document it had just parsed."
            exit 1
          fi
          printf 'running %d flake check(s) on %s: %s\n' "$count" "$system" "$joined"

      # -L so the pytest output of a failing suite is in this log. Without it a
      # red check reports `builder for '...drv' failed` and the assertion that
      # actually broke is behind a `nix log` on a machine nobody has.
      - name: nix flake check
        run: nix flake check -L

  stamped:
    name: no unstamped release on main
    # `main` only, and that is the whole design rather than an optimisation. An
    # unstamped `## vNEXT` is the CORRECT state of every branch in flight — the
    # placeholder is what stops two branches picking the same number — and becomes
    # a defect at exactly one moment: when it lands. A check running on pull_request
    # would fire on every release PR in the repo and be switched off within a week,
    # which is the failure mode `harness/tests/test_release_numbers.py` was written
    # around and this job is not going to re-invent.
    #
    # It is a guard, not the mechanism: `release_stamp.py apply` is meant to run
    # before the merge, and this is what makes forgetting it visible in the minutes
    # after rather than in whatever document a reader hits the literal string in.
    #
    # The corollary, for anyone wiring up branch protection: do NOT make this a
    # required status check. The `if` below means it never reports on a
    # pull_request, and a required check that never reports is not a check — it is
    # every PR in the repo stuck pending forever, waiting for a run that by design
    # will not happen. Require `app suite` and `harness suites`, which do run there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every release on main carries a number
        run: python3 scripts/release_stamp.py check

  tagged:
    name: every release on main has a tag
    # `main` only, like `stamped` above and for a related reason, but this one is a RECORD
    # rather than a lock and the distinction is the whole of why it exists (#296).
    #
    # The lock is `harness/githooks/pre-push`, which calls `release_tag.py reserve` and takes
    # `refs/tags/vX.Y` on the remote at the moment the release commit is pushed. A ref create
    # is compare-and-swap, so exactly one of two landers gets the number and the other is
    # refused before its branch is anywhere near here. What a hook cannot cover is `git push
    # --no-verify` and a checkout where the hook was never installed, and neither can be
    # closed from inside a hook. This job closes them for the RECORD: after the merge, every
    # release on main gets the tag it should already have had.
    #
    # It is not a second allocator and must not be read as one. By the time it runs the merge
    # has happened, so it can only write down what landed — if two branches both landed
    # `## v2.96`, `stamped` above is already red and this job has nothing to fix. Calling it
    # a lock would be the reassuring wrong answer this repo keeps finding.
    #
    # `backfill` never moves a tag, so this is idempotent and additive: the usual run creates
    # nothing at all, and where it creates nothing it pushes nothing and needs no write
    # access. `contents: write` is here for the exception, and it is job-scoped rather than
    # widened at the top of the file, where two jobs run arbitrary test code.
    #
    # `fetch-depth: 0` is load-bearing twice over: a release's tag names the commit that
    # first declared it, which is a question about the whole history, and depth-1 has one
    # commit — so a shallow checkout would tag all ninety-odd releases at HEAD, permanently,
    # and tags are not moved by anything here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record a tag for every release that has landed
        run: python3 scripts/release_tag.py backfill --ref HEAD --push

  frozen:
    name: no shipped release entry was rewritten
    # `pull_request` only, and — unlike `stamped` above — that makes this one SAFE to
    # require: it reports on every pull request, which is the event branch protection
    # gates on. It is skipped on push-to-main for a mechanical reason rather than a
    # policy one. The check is fork-relative, and on main the merge base with
    # `origin/main` is HEAD itself, so there is nothing left to compare; the guard for a
    # commit going straight to main is `harness/githooks/pre-push`, which asks the same
    # question before the push, while `origin/main` is still behind.
    #
    # It cannot cry wolf, which is the property the `stamped` job's comment above says a
    # PR-triggered check has to have. A branch that does not touch a released entry's text
    # passes by construction, and the only way to make it red is to change or delete the
    # notes of a release that already shipped — which is never something a correct branch
    # does. `## vNEXT` carries no number and is invisible to it, so a release PR is not a
    # special case here the way it is for `stamped`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0`. The whole question is what the CHANGELOG said at the commit this
      # branch forked from, and the default depth-1 checkout has no fork point at all — the
      # check would report `limited:` and pass on every run, which is the shape of a job that
      # reports green while verifying nothing. Depth 0 is also what puts `origin/main` in the
      # clone: checkout's shallow fetch takes the PR ref alone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Against the branch this PR TARGETS, not against main by name: a stacked PR onto an
      # epic integration branch would otherwise be judged against a base it is not merging
      # into. HEAD here is the merge commit GitHub builds for the PR, which is exactly what
      # would land, so a corruption introduced by the merge itself is caught as well as one
      # committed on the branch.
      - name: Check no released CHANGELOG entry changed
        # Through the environment, never interpolated into the script body. A branch name
        # arrives from whoever opened the pull request, and `${{ }}` substitution happens
        # before bash ever sees the line — so a `${{ github.base_ref }}` spliced into the
        # command is that person's text executing on this runner. As an env var it is data.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/release_stamp.py frozen --onto "origin/$BASE_REF" --branch HEAD

  migration-heads:
    name: one migration head after the merge
    # `pull_request` only, and that trigger is the whole of #351 rather than a detail of
    # it. `harness/githooks/pre-push` already asks this exact question — and gates it on
    # `is_protected "$branch"`, so a feature-branch push skips it, while `gh pr merge`
    # goes through the GitHub API and touches no local hook at all. This fleet lands every
    # PR that way (twelve on 2026-08-22 alone), so the hook's migration half had no path
    # to fire: on #349's landing, with a real migration in play, it printed exactly one
    # line and that line was about release numbers. The hook is correct and stays exactly
    # as it is — it is the backstop for anyone pushing a protected branch directly. This
    # job is the same check at the place the merge actually happens (#343, #351).
    #
    # Unlike `stamped` above, a pull_request trigger is right here, and the difference is
    # worth stating because the two look alike. That job's comment argues at length that a
    # pull_request version of ITSELF would fire on every release PR and be switched off
    # within a week — because an unstamped `## vNEXT` is the CORRECT state of a branch in
    # flight. Nothing here has that shape. A two-headed graph is never the correct state
    # of any branch, so there is no legitimate red for anyone to switch this off over.
    # The corollary for branch protection is `frozen`'s rather than `stamped`'s: this
    # reports on every pull request, so it is safe to make a required status check.
    #
    # WHAT IT DOES NOT CATCH, stated here rather than left for whoever trips it to find
    # out: two UNLANDED branches that each minted the same revision id. Four did on
    # 2026-08-22, all four preflights truthfully said GO, and none of them was wrong — at
    # push time each branch was individually single-headed, A carrying `0029` on main's
    # `0028` and B carrying `0029` on main's `0028`. The duplicate exists only in the
    # union of two branches neither of which has landed, and no check reading one ref
    # against the base can see it, this one included. That blind spot is #338.
    #
    # #341 closed it from the other end rather than by adding a third check here.
    # A revision id minted after it is opaque — `m` and eight hex digits, drawn at random
    # by `migrations/env.py` — so two branches cannot write the same one, and the union
    # this job could not judge is now an ordinary two-head graph, which is exactly what it
    # DOES judge. The blind spot survives only for the frozen legacy chain `0001`…`0034`,
    # where the id is still a number a second branch could arrive at by counting; nothing
    # written from now on can reach it.
    #
    # A second limit, same spirit: this re-runs when the PR is pushed to, not when the
    # base moves underneath it. A PR that was single-headed when it opened and is
    # two-headed after a sibling lands is not re-judged until something touches it.
    #
    # What it does buy: a pull request whose merge would leave the base with a graph
    # `alembic upgrade head` cannot run is refused, at the place this fleet merges instead
    # of at a place it never pushes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0`, for the same reason spelled out on `frozen` above: at the
      # default depth of 1 the checkout is the PR's merge commit and nothing else, the
      # base branch is not in the clone at all, and a check that reads it would be
      # reporting on a comparison it never made. The step below refuses to run rather
      # than going quietly green if that ever regresses.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the merge would leave exactly one migration head
        # Through the environment, never interpolated into the script body: `${{ }}`
        # substitution happens before bash sees the line, so a base branch name spliced
        # in that way is whoever opened the pull request executing text on this runner.
        # As an env var it is data. (Same reasoning as the `frozen` step above.)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          reconciler=scripts/migration_reconcile.py
          base="origin/$BASE_REF"
          tmp=$(mktemp -d)

          # Read every run, not only the failing ones. The base's own head list is what
          # tells a red report whether this branch introduced the second head or merely
          # inherited one, and it is what lets a PR that RESOLVES a two-headed base be
          # recognised as the fix rather than as a fluke. It is also what makes
          # `fetch-depth: 0` load-bearing on every run, which is the point of failing here.
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "::error::$base is not in this clone, so the merge cannot be judged against the branch it targets. That is what fetch-depth: 0 on the checkout is for; at the default depth of 1 the base branch is never fetched."
            exit 1
          fi

          # stdout and stderr kept APART rather than merged with 2>&1. The reconciler puts
          # the head ids on stdout and its `# N head(s)` summary on stderr, and a merged
          # capture interleaves them by whichever flushed first — pre-push learned that one
          # and its success note read back `single migration head (# 1 head(s))`. Both are
          # shown on a refusal, because discarding stderr leaves a genuine tool error
          # looking exactly like a two-head refusal with no detail.
          heads_at() {
            local rc=0
            python3 "$reconciler" heads --ref "$1" >"$tmp/$2.out" 2>"$tmp/$2.err" || rc=$?
            return "$rc"
          }

          # HEAD on a pull_request checkout is the merge commit GitHub builds for the PR —
          # what would actually land — so this reads the post-merge graph rather than the
          # branch's own, and a two-headed state introduced by the merge itself is caught
          # alongside one committed on the branch.
          base_rc=0; heads_at "$base" base || base_rc=$?
          merge_rc=0; heads_at HEAD merge || merge_rc=$?

          if (( merge_rc == 0 )); then
            printf 'migration graph after this merge: %s\n' "$(cat "$tmp/merge.out")"
            if (( base_rc != 0 )); then
              printf '%s itself is not single-headed; this PR resolves it:\n' "$base"
              sed 's/^/    /' "$tmp/base.out" "$tmp/base.err"
            fi
            exit 0
          fi

          if (( merge_rc == 2 )); then
            # Two different answers arrive as the same exit 2, and they must not be
            # reported as the same thing. `heads` returns 2 by itself when it counted the
            # heads and the count was not one — that is a graph defect, and the ids are on
            # stdout. Everything the reconciler refuses to answer at all comes back as
            # `STOP:` on stderr with nothing on stdout: a duplicate revision id, a
            # migration it cannot parse, or git failing under it. Calling the last of those
            # a two-headed graph would send the reader off to renumber a graph that is fine.
            if grep -q '^STOP: ' "$tmp/merge.err"; then
              annotation="the migration reconciler refused the graph at this PR's merge commit"
              echo 'The migration reconciler will not accept the graph at the merge commit of'
              echo 'this pull request, so merging it would leave the base branch in a state'
              echo '`alembic upgrade head` cannot be trusted to run. It says which, below —'
              echo 'usually a duplicate revision id, sometimes a migration it cannot read:'
            else
              annotation="merging would leave $BASE_REF with a multi-head migration graph"
              echo 'Merging this pull request would leave the base branch with a migration'
              echo 'graph `alembic upgrade head` cannot run: the graph at the merge commit is'
              echo 'not exactly one head.'
            fi
            echo
            sed '/^$/d; s/^/    /' "$tmp/merge.out" "$tmp/merge.err"
            echo
            if (( base_rc == 0 )); then
              printf '%s is single-headed (%s), so this branch is where it comes from.\n' \
                "$base" "$(head -n1 "$tmp/base.out")"
            else
              printf '%s does not pass this check either, so it predates the branch:\n' "$base"
              sed '/^$/d; s/^/    /' "$tmp/base.out" "$tmp/base.err"
            fi
            echo
            echo 'Reconcile before merging — the tool chooses the resolution:'
            echo "    python3 $reconciler preflight --onto $base"
            echo "    python3 $reconciler apply     --onto $base"
            echo
            echo 'Note what this check cannot see, so it is not read as more than it is: a'
            echo 'revision id duplicated across two branches that have BOTH yet to land is'
            echo 'invisible to it, because each branch is single-headed on its own (#338).'
            echo '#341 is what closes that case.'
            echo "::error::$annotation"
            exit 1
          fi

          # Anything other than 0 or the reconciler's documented 2 is the tool failing to
          # answer, and the two must not be reported as the same thing: a refusal that
          # asserts a two-headed graph over what was really a traceback sends the reader
          # off to renumber a graph that is fine. An unrunnable gate is not a passing gate,
          # so this is red rather than skipped.
          echo "the migration single-head check could not run (exit $merge_rc), so this"
          echo 'pull request is unverified rather than clean:'
          echo
          sed '/^$/d; s/^/    /' "$tmp/merge.out" "$tmp/merge.err"
          echo "::error::migration single-head check failed to run (exit $merge_rc)"
          exit 1

  changelog:
    name: a change that ships carries a release note
    # `pull_request` only, and safe to require for `frozen`'s reason rather than `stamped`'s:
    # it reports on every pull request, which is the event branch protection gates on. On a
    # push to main there is nothing left to ask — the fork point of a merged branch is itself,
    # so the diff is empty and the answer would be a vacuous pass. The place to ask is before
    # the merge, which is here.
    #
    # The `stamped` job's comment above argues that a PR-triggered check which is usually
    # wrong gets switched off within a week, and that argument is the reason this job's
    # scoping rule is a function with a forty-line docstring (`_exempt` in
    # `scripts/changelog_fragments.py`) rather than a `git diff --name-only | grep -q`. Run
    # against every pull request merged since fragments existed — thirty-eight of them — it
    # refuses exactly one, and that one is #363, the branch that prompted the issue. A
    # docs-only branch and a test-only branch pass in silence, which several that day were.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0`, and it is load-bearing exactly as it is on `frozen` and
      # `migration-heads` above: what changed is measured from the fork point, and a depth-1
      # checkout has no fork point at all. This job does not go quietly green in that case —
      # `required` refuses when it cannot find a merge base — which is the difference between
      # a gate that is unrunnable and a gate that is passing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before asking whether a fragment exists, ask whether the ones that do can be read.
      # Nothing in CI ran this until now: a fragment with a `##` heading in its body, or one
      # naming a version, was caught by the human running `assemble` at land time — which is
      # the last moment anyone wants to discover it, and one merge queue away from the moment
      # it is discovered by the release entry coming out wrong.
      - name: Check every fragment parses
        run: python3 scripts/changelog_fragments.py check

      - name: Check this pull request carries a changelog entry
        # Through the environment, never interpolated into the script body: `${{ }}`
        # substitution happens before bash sees the line, so a base branch name spliced in
        # that way is whoever opened the pull request executing text on this runner. As an env
        # var it is data. (Same reasoning as the two jobs above.)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/changelog_fragments.py required --onto "origin/$BASE_REF" --branch HEAD
