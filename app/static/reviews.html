<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>quarterback — reviewer panel</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#6ea8fe; --chip:#232936;
    /* Categorical slots, stepped for the dark panel surface and validated as a
       set (adjacent CVD ΔE 8.4, normal-vision 19.3, all ≥3:1 on #171a21).
       Bound to the VENDOR, not to rank: filtering the table must never repaint
       a reviewer, or a week-on-week read of the same page lies. */
    --s-claude:#3987e5; --s-codex:#d95926; --s-gemini:#199e70;
    --s-pi:#c98500; --s-sonarqube:#d55181; --s-other:#8b93a3;
    /* Reserved status steps — never reused as a categorical slot. */
    --good:#35c48a; --warn:#f0b429; --bad:#e5484d;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  a { color:var(--accent); }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line); padding:10px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .spacer { flex:1; }
  select, input, label { font:inherit; font-size:12px; }
  select { background:var(--chip); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; }
  label.check { color:var(--muted); display:flex; align-items:center; gap:5px; cursor:pointer; }
  main { max-width:1080px; margin:0 auto; padding:14px 16px 60px; }
  h2 { font-size:13px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    color:var(--muted); margin:26px 0 8px; }
  h2 .note { text-transform:none; letter-spacing:0; font-weight:400; font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:36px; }

  /* headline tiles — a hero number needs no plot */
  .tiles { display:flex; gap:10px; flex-wrap:wrap; }
  .tile { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:10px 14px; min-width:120px; }
  .tile .n { font-size:22px; font-weight:600; line-height:1.2; }
  .tile .k { font-size:11px; color:var(--muted); letter-spacing:.4px; }

  table { width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th { text-align:right; font-weight:600; font-size:11px; color:var(--muted);
    letter-spacing:.4px; padding:7px 8px; border-bottom:1px solid var(--line);
    white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; padding-left:12px; }
  td { padding:7px 8px; text-align:right; border-bottom:1px solid #1e222b;
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#1c212b; }
  .dim { color:var(--muted); }

  .who { display:flex; align-items:center; gap:7px; }
  /* 2px surface ring so a swatch never touches the row fill */
  .sw { width:9px; height:9px; border-radius:2px; flex:0 0 auto;
    box-shadow:0 0 0 2px var(--panel); }
  .chip { font-size:10px; padding:1px 6px; border-radius:4px; background:var(--chip);
    border:1px solid var(--line); color:var(--muted); }

  /* ranked bar: thin mark, 4px rounded data-end, anchored to a common baseline */
  .barcell { width:34%; }
  .bar { position:relative; height:12px; background:#1e222b; border-radius:3px; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:0 4px 4px 0;
    display:block; min-width:2px; }
  .barlab { position:absolute; right:6px; top:-1px; font-size:11px; color:var(--fg);
    text-shadow:0 0 4px var(--panel); }

  /* precision meter: one neutral fill — identity is already carried by the row */
  .meter { display:inline-flex; align-items:center; gap:7px; }
  .meter .track { width:52px; height:6px; background:#1e222b; border-radius:3px;
    position:relative; overflow:hidden; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; border-radius:0 3px 3px 0; }
  .pct { min-width:38px; display:inline-block; }

  /* tokens: same meter shape as precision, but the track only appears when the
     vendor has a second tier to compare against — a full-width bar next to a
     lone row would invite exactly the cross-vendor read this must not support. */
  .tokcell { width:11%; }
  .tok { display:inline-flex; align-items:center; gap:7px; justify-content:flex-end; }
  .tok .track { width:40px; height:6px; background:#1e222b; border-radius:3px;
    position:relative; overflow:hidden; }
  .tok .fill { position:absolute; left:0; top:0; bottom:0; border-radius:0 3px 3px 0; }
  .tok .tokn { min-width:44px; display:inline-block; }
  .tok.lone .tokn { color:var(--muted); }

  .runrow { cursor:pointer; }
  .detail td { background:#12151c; text-align:left; white-space:normal; padding:10px 12px 12px; }
  .detail table { background:transparent; border:none; }
  .fnd { display:flex; gap:8px; align-items:baseline; padding:2px 0; font-size:12px; }
  .fnd .sev { font-weight:600; font-size:10px; min-width:22px; }
  .fnd .loc { color:var(--accent); }
  .fnd.dismissed { color:var(--muted); text-decoration:line-through; }
  .fnd .by { color:var(--muted); font-size:11px; }
  .fnd.has-acct { cursor:pointer; }

  /* what each reviewer actually said — the merge, opened up */
  .accounts { margin:2px 0 8px 30px; border-left:2px solid var(--line); padding-left:10px; }
  .acct { padding:3px 0; font-size:12px; }
  .acct .hdr { display:flex; gap:7px; align-items:center; }
  .acct .txt { color:var(--muted); white-space:pre-wrap; margin-top:1px; }

  /* observation chains: one mark per run of this PR, in order */
  .chain { display:flex; gap:8px; align-items:baseline; padding:3px 0; font-size:12px; }
  .dots { display:inline-flex; gap:3px; flex:0 0 auto; }
  .dot { width:8px; height:8px; border-radius:50%; background:#1e222b;
    box-shadow:inset 0 0 0 1px var(--line); }
  .st { font-size:10px; font-weight:600; letter-spacing:.3px; min-width:56px; }
  .st.open { color:var(--warn); } .st.gone { color:var(--good); }
  .st.dismissed { color:var(--muted); }

  /* what happened AFTER the judge. A status reading, so it takes the reserved
     status steps and never a categorical slot — and `refuted` is deliberately
     the loud one: it is the only value here that contradicts the record. */
  .oc { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--chip); }
  .oc.fixed { color:var(--good); } .oc.refuted { color:var(--bad); }
  .oc.deferred { color:var(--warn); } .oc.superseded { color:var(--muted); }
  /* An outcome nobody signed off. Marked rather than hidden or refused: the API
     records it, so the page has to say which it is. */
  .oc .un { opacity:.75; }
  .toggle { background:none; border:none; color:var(--accent); font:inherit;
    font-size:12px; cursor:pointer; padding:6px 0 0; }

  #tip { position:fixed; z-index:20; pointer-events:none; display:none;
    background:#0b0d12; border:1px solid var(--line); border-radius:6px;
    padding:6px 9px; font-size:11px; line-height:1.45; box-shadow:0 6px 18px #0008; }
</style>
</head>
<body>
<header>
  <h1>quarterback · reviewer panel</h1>
  <span class="dim" id="window"></span>
  <span class="spacer"></span>
  <select id="repo"><option value="">all repos</option></select>
  <select id="days">
    <option value="">all time</option>
    <option value="7">last 7 days</option>
    <option value="30" selected>last 30 days</option>
    <option value="90">last 90 days</option>
    <option value="365">last year</option>
  </select>
  <label class="check"><input type="checkbox" id="judged" checked /> judged runs only</label>
  <a href="/">board →</a>
</header>
<main>
  <div class="tiles" id="tiles"></div>

  <h2>Model leaderboard
    <span class="note" id="lbNote"></span></h2>
  <div id="leaderboard"></div>

  <h2>By agent <span class="note">— who ordered the review</span></h2>
  <div id="agents"></div>

  <h2>Recent runs</h2>
  <div id="runs"></div>
</main>
<div id="tip"></div>

<script>
const $ = (id) => document.getElementById(id);
const SERIES = ["claude", "codex", "gemini", "pi", "sonarqube"];

// Quotes too, not just angle brackets: nearly every use here is inside an
// attribute, where innerHTML escaping alone leaves a value free to close it.
function esc(s){ const d=document.createElement("div"); d.textContent=s??"";
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function hue(name){ return SERIES.includes(name) ? `var(--s-${name})` : "var(--s-other)"; }
function ago(iso){ if(!iso) return "—";
  const s=Math.max(0,(Date.now()-Date.parse(iso))/1000);
  if(s<60) return Math.floor(s)+"s"; if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
function pct(x){ return x==null ? "—" : Math.round(x*100)+"%"; }
// Token counts run to seven figures, and seven figures in a table column is a
// number nobody reads. One significant decimal keeps 1.2M distinguishable from
// 1.9M, which is the only comparison this column is for.
function fmtTok(n){
  if (n == null) return "—";
  if (n >= 1e6) return (n/1e6).toFixed(n < 1e7 ? 1 : 0)+"M";
  if (n >= 1e3) return (n/1e3).toFixed(n < 1e4 ? 1 : 0)+"k";
  return String(n);
}
function fmtUsd(x){ return x == null ? "—" : "$" + (x >= 1 ? x.toFixed(2) : x.toFixed(4)); }
// Precision is a quality reading, not a series — status colours, which are
// reserved for exactly this and always ship beside the number, never alone.
function precColor(x){ return x==null ? "var(--muted)"
  : x>=0.75 ? "var(--good)" : x>=0.5 ? "var(--warn)" : "var(--bad)"; }
// 100% off two findings must not read like 86% off ninety. Below this many
// adjudicated findings the ratio is recessive and marked, not hidden — the row
// still exists, it just stops competing for the eye.
const THIN = 10;
function ruled(r){ return r.confirmed + r.dismissed; }
function thin(r){ return r.precision != null && ruled(r) < THIN; }
// The same rule for the after-the-fact ratio, over its OWN population:
// `outcomes_scored` (fixed + refuted), which is what `precision_after` divides,
// and never `outcomes_recorded`, which also counts deferred and superseded. A
// member with 1 fixed and 11 deferred has 12 recorded outcomes and one scored
// defect — keying the marker on the recorded count rendered an unasterisked,
// confident 100% off that single finding. A marker has to be computed over the
// population of the number it annotates; this page has now learned that twice
// (see `billable_runs` above).
//
// It will mark nearly every row for a while, and that is the honest state — an
// outcome is recorded by hand, so the early numbers really are two or three
// defects wide.
function thinAfter(r){ return r.precision_after != null && (r.outcomes_scored || 0) < THIN; }

let tipEl = $("tip");
function bindTip(el, html){
  el.addEventListener("mousemove", (e) => {
    tipEl.innerHTML = html; tipEl.style.display = "block";
    const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.min(e.clientX + pad, innerWidth - w - 8) + "px";
    tipEl.style.top  = Math.min(e.clientY + pad, innerHeight - h - 8) + "px";
  });
  el.addEventListener("mouseleave", () => { tipEl.style.display = "none"; });
}

function qs(extra){
  const p = new URLSearchParams();
  if ($("repo").value) p.set("repo", $("repo").value);
  if ($("days").value) p.set("days", $("days").value);
  Object.entries(extra || {}).forEach(([k, v]) => p.set(k, v));
  return p;
}

// ---- leaderboard -----------------------------------------------------------
// Ranked horizontal bars: the job is "who found the most real issues", which is
// magnitude + identity, so one bar per competitor on a shared baseline, sorted.
// Every row is direct-labelled with its reviewer, so identity never rests on
// colour alone and no legend box is needed.
// Tokens are the one column here that must NOT be read down the page. Different
// vendors tokenize differently and cache differently — a "say hi" to Claude has
// billed almost entirely against cache-*creation* tokens on a two-token prompt —
// so ranking vendors by them measures the tokenizer, not the reviewer. They are
// only meaningful BETWEEN TIERS OF THE SAME VENDOR (opus vs sonnet, codex xhigh
// vs medium): same tokenizer, same cache semantics, directly comparable. So the
// bar is scaled within the reviewer's own group and drawn only when that group
// has a sibling to compare against; duration stays the cross-vendor axis.
function tokenScale(rows){
  const max = {};
  rows.forEach(r => {
    if (r.tokens_per_run == null) return;
    const g = max[r.reviewer] || (max[r.reviewer] = { peak: 0, tiers: 0 });
    g.peak = Math.max(g.peak, r.tokens_per_run);
    g.tiers++;
  });
  return max;
}

// The token half of a row's tooltip. Says nothing at all when nothing was
// recorded — a "0 tokens" line under a reviewer the panel simply never
// instrumented is a worse answer than no line.
function tokenTip(r){
  if (r.total_tokens == null && r.cost_usd == null) return "";
  const parts = [];
  if (r.input_tokens != null) parts.push(`${fmtTok(r.input_tokens)} in`);
  if (r.output_tokens != null) parts.push(`${fmtTok(r.output_tokens)} out`);
  if (r.cached_input_tokens) parts.push(`${fmtTok(r.cached_input_tokens)} cached`);
  if (r.reasoning_tokens) parts.push(`${fmtTok(r.reasoning_tokens)} thinking`);
  const partOf = (n, of) => ` <span style="color:var(--warn)">(${n} of ${of} runs reported)</span>`;
  const cover = r.token_runs < r.runs ? partOf(r.token_runs, r.runs) : "";
  // The cost column needs the same qualifier, and for a sharper reason: it is
  // the one denominated in money. `cost_runs` was computed, shipped, and named
  // in the endpoint's own docstring, and the page read `token_runs` for both
  // markers and nothing at all for this one — so a group where the vendor
  // priced 2 runs of 10 presented that partial sum as the group's spend, which
  // is the exact failure `token_runs` was introduced to prevent.
  const costCover = r.cost_runs < r.runs ? partOf(r.cost_runs, r.runs) : "";
  // `parts` is empty for a group that stated a cost and no tokens, and the token
  // coverage line then read as a bare "(0 of N runs reported)" under a real
  // figure, annotating nothing.
  const tokenLine = parts.length ? `${parts.join(" · ")}${cover}` : "";
  return `<br>—<br>${tokenLine}
    ${r.tokens_per_confirmed ? `<br>${fmtTok(r.tokens_per_confirmed)} tokens per confirmed finding` : ""}
    ${r.cost_usd != null
      ? `<br>${fmtUsd(r.cost_usd)} stated by the vendor${costCover}${
          r.cost_per_confirmed ? ` · ${fmtUsd(r.cost_per_confirmed)} per confirmed` : ""}`
      : "<br><span class='dim'>no cost stated by this vendor</span>"}
    <br><span class="dim">tokens compare this vendor's tiers, not one vendor with another</span>`;
}

// How the buckets this page knows about are worded, in the order they are worth
// reading: what the last fix caused, what the last round missed, what it could
// not have seen, what could not be placed. Spelled as the panel spells them —
// one vocabulary from `panel.py` through the payload and the columns to here.
//
// A LOOKUP, never the list of what exists. Migration 0017 says this vocabulary
// grows when #41 makes attribution exact, and a hard-coded array was silently
// excluding any new bucket from both the tooltip's sum and the tile's
// denominator — the same drop-without-a-word shape one layer up. Every total on
// this page is therefore summed over the object the server sent, and a bucket
// with no wording here is still counted and still named, just in its own words.
const PROV_WORDS = {
  introduced: n => `${n} introduced by the last fix`,
  missed: n => `${n} the last round missed`,
  "missed-unread": n => `${n} in a file that round could not read`,
  unknown: n => `${n} unplaceable`,
};
const PROV_ORDER = Object.keys(PROV_WORDS);

// Every bucket the server sent, in this page's reading order, with anything it
// has never heard of after them rather than dropped.
function provKeys(p){
  return [...PROV_ORDER.filter(k => k in p),
          ...Object.keys(p).filter(k => !(k in PROV_WORDS))];
}
function provTotal(p){
  return Object.values(p || {}).reduce((a, v) => a + (v || 0), 0);
}
function provWords(k, n){
  return (PROV_WORDS[k] || (m => `${m} ${k}`))(n);
}

// #48's second axis for one reviewer. Finding a regression somebody just wrote
// and finding a defect that has sat there for months are different competencies,
// and the confirmed count in the row cannot tell them apart.
//
// Gated on `provenance_runs`, not on the counts. The columns behind them are NOT
// NULL, so a window of runs recorded before v2.26 reports four zeros that mean
// "never measured" — rendering those as "0 introduced" would be the page stating
// a result nobody produced.
function provTip(r){
  if (!r.provenance_runs) return "";
  const p = r.provenance || {};
  const n = provTotal(p);
  const of = `${r.provenance_runs} run${r.provenance_runs === 1 ? "" : "s"} where the cause could be traced`;
  if (!n) return `<br><span class="dim">nothing of its own attributed in ${of}</span>`;
  const rest = provKeys(p)
    .filter(k => k !== "introduced" && k !== "missed" && (p[k] || 0))
    .map(k => provWords(k, p[k]))
    .join(", ");
  return `<br>across ${of}: <b>${p.introduced || 0}</b> introduced by the last fix,
    ${p.missed || 0} the last round missed${rest ? ` (${rest})` : ""}`;
}

// What happened to a defect after the judge ruled on it (v2.37). The words are
// the API's, one vocabulary from `POST /review/outcomes` through the column and
// the stats to here — and a bucket this page has never heard of is still counted
// and still named, in its own words, the rule `PROV_WORDS` records above.
const OUTCOME_WORDS = {
  fixed: n => `${n} fixed`,
  refuted: n => `${n} refuted — the finding was wrong`,
  deferred: n => `${n} deferred`,
  superseded: n => `${n} superseded by a later finding`,
};

// The half of a row's tooltip that is about what SURVIVED. Silent when nobody
// has recorded an outcome for this member: "0 refuted" over findings nobody has
// scored is the most flattering possible way to say "not measured", and it is
// exactly the reading `precision` alone has been giving all along.
function outcomeTip(r){
  const o = r.outcome || {};
  if (!r.outcomes_recorded) {
    return r.confirmed_defects
      ? `<br><span class="dim">nothing recorded about what happened to its
         ${r.confirmed_defects} defect${r.confirmed_defects === 1 ? "" : "s"}</span>`
      : "";
  }
  const att = r.outcome_attested || {};
  // `esc(k)` on the fallback: every other dynamic value on this page is escaped,
  // and this branch exists precisely for a bucket the page has never seen — i.e.
  // for the day the vocabulary widens, which is exactly when an unescaped one
  // would first matter.
  const said = Object.entries(o).filter(([, count]) => count)
    .map(([k, count]) => (OUTCOME_WORDS[k] || (m => `${m} ${esc(k)}`))(count)).join(", ");
  // Refutations nobody CLAIMS a human signed off. Named, because #77's rule is
  // that an agent must not grade its own findings unattended and the API records
  // rather than enforces it — so the page is where a reader sees which it is
  // looking at.
  const unattested = (o.refuted || 0) - (att.refuted || 0);
  const defects = r.confirmed_defects || 0;
  return `<br>—<br>after the fact: ${said}
    <span class="dim">(${r.outcomes_recorded || 0} of ${defects}
      defect${defects === 1 ? "" : "s"} ruled on,
      ${r.outcomes_scored || 0} of them fixed-or-refuted)</span>
    ${r.precision_after == null ? ""
      : `<br><b>${pct(r.precision_after)}</b> of its scored findings held up,
         against ${pct(r.precision)} the judge confirmed`}
    ${unattested > 0 ? `<br><span style="color:var(--warn)">${unattested} refutation${
        unattested === 1 ? "" : "s"} with no human signoff claimed</span>` : ""}`;
}

function renderLeaderboard(rows, judgedOnly){
  $("lbNote").textContent = (judgedOnly
    ? "— judged runs only, so precision is a real ratio"
    : "— includes unjudged runs; precision counts only adjudicated findings")
    + `; * = fewer than ${THIN} findings ruled on`
    + "; “after” is precision scored against the code rather than the judge, over"
    + " the defects somebody has since ruled on"
    + "; tokens compare tiers of ONE vendor, never two vendors";
  if (!rows.length){ $("leaderboard").innerHTML = '<div class="empty">no runs recorded yet</div>'; return; }
  const max = Math.max(...rows.map(r => r.confirmed), 1);
  const scale = tokenScale(rows);
  const body = rows.map(r => {
    const label = r.model ? `${r.reviewer} <span class="chip">${esc(r.model)}${r.effort ? " · " + esc(r.effort) : ""}</span>`
                          : `${r.reviewer} <span class="chip dim">model not recorded</span>`;
    const w = (r.confirmed / max) * 100;
    // "?" where only some of the group's runs reported usage: the number is real
    // but it is not the whole window, and an unmarked partial sum reads as total.
    // Against `runs`, not `ran`: a member that burned tokens and then timed out
    // is measured but did not run, so it counts in `token_runs` and not in
    // `ran` — and comparing the two hid the marker on the very groups with one.
    //
    // And over `billable_runs`, because this marker gates the tokens/run CELL and
    // that cell holds `total_tokens / billable_runs`. `billable_runs` exists
    // precisely because it differs from `token_runs` — a run stating only a
    // cached or reasoning figure is instrumented but contributes nothing to
    // `total_tokens` — and the endpoint names it in the response so a client can
    // see which population the average is over rather than assuming it matches
    // coverage. Keying on `token_runs` was this page assuming exactly that: a
    // group with runs=2, token_runs=2, billable_runs=1 rendered its half-group
    // average with no marker at all. A marker has to be computed over the
    // population of the number it annotates.
    const partial = r.billable_runs > 0 && r.billable_runs < r.runs;
    const g = scale[r.reviewer];
    const cmp = g && g.tiers > 1 && r.tokens_per_run != null;
    return `<tr>
      <td><span class="who"><span class="sw" style="background:${hue(r.reviewer)}"></span>${label}</span></td>
      <td class="barcell"><div class="bar"><i style="width:${w}%;background:${hue(r.reviewer)}"></i>
        <span class="barlab">${r.confirmed}</span></div></td>
      <td><span class="meter" style="opacity:${thin(r) ? .45 : 1}"><span class="track"><span class="fill"
          style="width:${r.precision == null ? 0 : r.precision * 100}%;background:${precColor(r.precision)}"></span></span>
        <span class="pct" style="color:${precColor(r.precision)}">${pct(r.precision)}${thin(r) ? "*" : ""}</span></span></td>
      <td><span class="pct" style="color:${
        r.precision_after == null ? "var(--muted)" : precColor(r.precision_after)};opacity:${
        thinAfter(r) ? .45 : 1}" title="${r.precision_after == null
          ? `nothing scored yet of its ${r.confirmed_defects || 0} confirmed defect(s)`
          : `${r.outcomes_scored || 0} of ${r.confirmed_defects || 0} defects scored`
            + ` fixed-or-refuted (${r.outcomes_recorded || 0} have any outcome at all)`}">${
        r.precision_after == null ? "—" : pct(r.precision_after) + (thinAfter(r) ? "*" : "")}</span></td>
      <td>${r.solo}</td><td class="dim">${pct(r.consensus_rate)}</td>
      <td>${r.p1}</td><td>${r.raised}</td><td>${r.dismissed}</td>
      <td>${r.confirmed_per_run ?? "—"}</td>
      <td class="tokcell">${r.tokens_per_run == null ? '<span class="dim">—</span>'
        : `<span class="tok${cmp ? "" : " lone"}">${cmp
            ? `<span class="track"><span class="fill" style="width:${
                 (r.tokens_per_run / g.peak) * 100}%;background:${hue(r.reviewer)}"></span></span>` : ""
           }<span class="tokn">${fmtTok(r.tokens_per_run)}${partial ? "?" : ""}</span></span>`}</td>
      <td class="dim">${r.ran}${r.skipped_runs ? ` <span style="color:var(--warn)">+${r.skipped_runs}✗</span>` : ""}</td>
    </tr>`;
  }).join("");
  $("leaderboard").innerHTML = `<table>
    <thead><tr>
      <th>reviewer</th><th>confirmed findings</th><th>precision</th>
      <th title="of the defects somebody has since ruled on, the share that were fixed rather than refuted — per DEFECT, not per observation">after</th>
      <th>solo</th>
      <th>consensus</th><th>P1</th><th>raised</th><th>dismissed</th><th>conf/run</th>
      <th title="tokens per review — comparable only against the same vendor's other tiers">tokens/run</th>
      <th>runs</th>
    </tr></thead><tbody>${body}</tbody></table>`;

  // Bound by index against the same sorted array the rows came from — the row
  // object stays a JS value rather than being round-tripped through a DOM
  // attribute, which is where the quoting goes wrong.
  $("leaderboard").querySelectorAll("tbody tr").forEach((tr, i) => {
    const r = rows[i];
    bindTip(tr, `<b>${esc(r.reviewer)}</b>${r.model ? " · " + esc(r.model) : ""}${r.effort ? " · " + esc(r.effort) : ""}<br>
      raised ${r.raised} → <b>${r.confirmed} confirmed</b>, ${r.dismissed} dismissed${r.unjudged ? `, ${r.unjudged} unjudged` : ""}<br>
      ${r.solo} found by nobody else · ${r.p1} P1<br>
      ${r.shared} also raised by someone else (${pct(r.consensus_rate)} of what it raised)<br>
      precision over ${ruled(r)} adjudicated finding${ruled(r) === 1 ? "" : "s"}<br>
      ${r.severity_calibration == null
        ? "severity vs the judge: not recorded"
        : `severity matched the judge on ${pct(r.severity_calibration)}
           (${r.sev_stricter} rated worse, ${r.sev_looser} milder)`}<br>
      ran in ${r.ran} of ${r.runs} runs${r.skipped_runs ? ` (${r.skipped_runs} skipped)` : ""}
      ${r.truncated_runs ? `<br>saw only part of the diff in ${r.truncated_runs} of them` : ""}
      ${r.unstructured_runs ? `<br>answered unparseably in ${r.unstructured_runs} of them` : ""}
      ${r.declared_gaps_runs ? `<br>said what it could not assess in ${r.declared_gaps_runs}` : ""}
      ${r.rereview_flagged ? `<br>${r.rereview_flagged} fix(es) it asked to have re-read` : ""}
      ${r.avg_duration_ms ? `<br>avg ${Math.round(r.avg_duration_ms / 1000)}s per review` : ""}
      ${r.ms_per_confirmed ? `<br>${Math.round(r.ms_per_confirmed / 1000)}s per confirmed finding` : ""}
      ${provTip(r)}
      ${outcomeTip(r)}
      ${tokenTip(r)}`);
  });
}

function renderAgents(rows){
  if (!rows.length){ $("agents").innerHTML = '<div class="empty">—</div>'; return; }
  $("agents").innerHTML = `<table>
    <thead><tr><th>agent</th><th>runs</th><th>PRs</th><th>confirmed</th><th>dismissed</th><th>last</th></tr></thead>
    <tbody>${rows.map(a => `<tr>
      <td>${esc(a.author)}</td><td>${a.runs}</td><td>${a.prs}</td>
      <td>${a.confirmed}</td><td class="dim">${a.dismissed}</td>
      <td class="dim">${ago(a.last_run)} ago</td></tr>`).join("")}</tbody></table>`;
}

// ---- recent runs -----------------------------------------------------------
// A reviewer that saw half the diff, one that never ran, and one that said what
// it could not judge all leave the same finding count behind. These are the
// marks that keep them apart on the page — never as colour alone, and never
// hidden behind a click. Row-level only: which members of THIS run read a prefix,
// and which said what they could not judge. A run whose reviewers saw half the
// change has to look different in the list, not only once you open it — inside
// the detail table the cell says "saw N chars" in words, so a glyph repeating it
// earns nothing.
function coverageMarks(cards){
  const cut = cards.filter(c => c.truncated).map(c => c.name);
  // A member whose reply did not parse declared nothing it may have wanted to,
  // so it belongs beside the declared gaps rather than under a silent null.
  const gaps = cards.filter(c => (c.could_not_assess || []).length || c.unstructured);
  const gapTip = gaps.map(c => `${c.name}: ${c.unstructured ? "reply did not parse"
      : c.could_not_assess.join(" · ")}`).join(" | ");
  return (cut.length ? ` <span style="color:var(--warn)"
      title="read a prefix of the diff: ${esc(cut.join(", "))}">✂</span>` : "")
    + (gaps.length ? ` <span style="color:var(--warn)"
      title="${esc(gapTip)}">?</span>` : "");
}

function runRow(r){
  const gate = r.ci_status === "FAIL" || r.sonar_gate === "ERROR" ? "var(--bad)"
             : r.ci_status === "PASS" ? "var(--good)" : "var(--muted)";
  const swatches = (r.reviewers || []).map(c =>
    `<span class="sw" title="${esc(c.name)}${c.ran ? "" : " (skipped)"}"
       style="background:${hue(c.name)};opacity:${c.ran ? 1 : .28}"></span>`).join(" ");
  // Round, and whether stopping there was earned. A run that stopped at the cap,
  // or with a reviewer reading half the diff, must not read like one that was
  // reviewed until there was nothing left to find.
  const unearned = r.stop_confident === false;
  const round = `<span class="chip"${r.stop_reason ? ` title="${esc(r.stop_reason)}"` : ""}
      style="${unearned ? "color:var(--warn)" : ""}">r${r.round || 1}${unearned ? " ⚠" : ""}</span>`;
  return `<tr class="runrow" data-id="${r.id}">
    <td><span class="who">${swatches}<a href="https://github.com/${esc(r.repo)}/pull/${r.pr}"
      target="_blank" rel="noreferrer">${esc(r.repo)}#${r.pr}</a>${round}${
      coverageMarks(r.reviewers || [])}</span>
      <div class="dim" style="font-size:11px">${esc(r.pr_title || "")}</div></td>
    <td class="dim">${esc(r.author)}</td>
    <td>${r.confirmed}${r.unjudged ? ` <span style="color:var(--warn)"
      title="kept but never adjudicated">+${r.unjudged}?</span>` : ""}</td>
    <td class="dim">${r.dismissed}</td>
    <td class="dim" title="findings this round that no earlier round raised">${
      r.new_findings == null ? "—" : r.new_findings}</td>
    <td>${r.sonar ? r.sonar : "<span class='dim'>—</span>"}</td>
    <td style="color:${gate}">${esc(r.ci_status || "—")}</td>
    <td class="dim">${r.judged ? esc(r.judge_model || "judged") : "<span style='color:var(--warn)'>unjudged</span>"}</td>
    <td class="dim">${ago(r.ts)} ago</td>
  </tr>`;
}

// What each reviewer actually said, kept verbatim (v2.11). Collapsed by default:
// the synthesis is the summary, and the accounts are the audit of it.
function accountsBlock(f){
  const rb = f.reported_by || [];
  if (!rb.length) return "";
  return `<div class="accounts" hidden>${rb.map(a => `
    <div class="acct">
      <div class="hdr"><span class="sw" style="background:${hue(a.reviewer)}"></span>
        <b>${esc(a.reviewer)}</b>
        <span class="dim">${esc(a.severity || "no severity")}${a.line ? " · :" + a.line : ""}</span>
        ${a.severity && f.severity && a.severity !== f.severity
          ? `<span class="chip">judge: ${esc(f.severity)}</span>` : ""}</div>
      ${a.account ? `<div class="txt">${esc(a.account)}</div>` : ""}
    </div>`).join("")}</div>`;
}

// On one line deliberately: a template literal keeps the newline and the source
// indentation, and a `title` attribute renders both — so wrapping this the way
// the surrounding code wraps put a line break and eight spaces inside the
// tooltip text. Every other tooltip here is one line or uses `<br>` on purpose.
const PROV_CHIP_TIP = "did the previous fix pass cause this, or did the previous round miss it? a signal, not a verdict";

// What somebody found out by acting on the finding — beside the verdict, never
// instead of it. The two are allowed to disagree, and a `confirmed` finding
// carrying a `refuted` outcome is the whole reason this exists, so the chip has
// to sit next to the row rather than restyle it.
function outcomeChip(o){
  if (!o) return "";
  // "claims" and not "signed off by": `attested_by` is free text from the same
  // request that carried the outcome, so it says the RECORDER asserts a human
  // agreed. Rendering it as a signature would make the one number meant to be
  // trustworthy the one with no provenance — so the claim always travels with
  // its claimant.
  // Attestation is only meaningful on a refutation — that is the outcome #77's
  // self-grading rule is about. Printing "unattended" under a `fixed` invited a
  // reader to look for a signoff that nothing ever wanted.
  const refuted = o.outcome === "refuted";
  const who = !refuted ? `recorded by ${o.set_by}`
    : o.attested_by ? `${o.set_by} claims signoff by ${o.attested_by}`
    : `unattended (recorded by ${o.set_by})`;
  const extra = o.deferred_to ? ` → ${o.deferred_to}`
              : o.superseded_by ? ` → ${o.superseded_by}` : "";
  const was = o.prior_outcome ? ` (was ${o.prior_outcome})` : "";
  // "changed", not "amended": `revisions` counts an outcome MOVE as well as a
  // field rewritten under an unchanged one, so naming it after the second
  // asserted an edit to the evidence that a plain renumbering never made.
  const rev = o.revisions ? ` · changed ${o.revisions}×` : "";
  const tip = `${o.outcome}${extra}${was} · ${who}${rev}${o.note ? "\n" + o.note : ""}`;
  return `<span class="oc ${esc(o.outcome)}" title="${esc(tip)}">${esc(o.outcome)}${
    esc(extra)}${!refuted ? ""
      : o.attested_by ? ' <span class="un">·signoff claimed</span>'
      : ' <span class="un">·unattested</span>'}</span>`;
}

function findingBlock(f){
  const n = (f.reported_by || []).length;
  const who = (f.reviewers || []).map(esc).join(", ") || f.verdict;
  return `<div class="fnd ${f.verdict}${n ? " has-acct" : ""}">
      <span class="sev">${esc(f.severity || "")}</span>
      <span class="loc">${esc(f.file || "")}${f.line ? ":" + f.line : ""}</span>
      <span>${esc(f.title)}</span>
      <span class="by">${who}${f.reviewers && f.reviewers.length > 1 ? " ⋆" : ""}</span>
      ${f.provenance ? `<span class="chip dim" title="${PROV_CHIP_TIP}">${esc(f.provenance)}</span>` : ""}
      ${outcomeChip(f.outcome)}
      ${n ? `<span class="chip">${n} account${n === 1 ? "" : "s"} ▸</span>` : ""}
    </div>${accountsBlock(f)}`;
}

// One defect, every run it was seen in. Filled mark = raised that run, hollow =
// not raised — which is how "did the fix land?" reads off the page at all.
function dotFor(runId, obs){
  const o = obs.find(x => x.run_id === runId);
  if (!o) return `<span class="dot" title="run ${runId}: not raised"></span>`;
  const bg = o.verdict === "dismissed" ? "var(--muted)"
           : o.verdict === "confirmed" ? "var(--bad)" : "var(--warn)";
  return `<span class="dot" title="run ${runId}: ${esc(o.verdict)}"
    style="background:${bg};box-shadow:none"></span>`;
}

async function renderHistory(box, repo, pr){
  box.innerHTML = '<div class="dim">loading…</div>';
  const res = await fetch(`/review/findings?repo=${encodeURIComponent(repo)}&pr=${pr}`,
    { headers: { Accept: "application/json" } });
  if (!res.ok){ box.innerHTML = '<div class="dim">could not load PR history</div>'; return; }
  const h = await res.json();
  if (!h.findings.length){ box.innerHTML = '<div class="dim">no findings on this PR</div>'; return; }
  const chains = h.findings.map(c => `<div class="chain">
      <span class="dots">${h.runs.map(r => dotFor(r.id, c.observations)).join("")}</span>
      <span class="st ${c.status}">${c.status}</span>
      <span class="sev">${esc(c.severity || "")}</span>
      <span class="loc">${esc(c.file || "")}${c.line ? ":" + c.line : ""}</span>
      <span>${esc(c.title)}</span>
      ${c.needs_rereview ? `<span class="chip" title="a reporter said this fix needs re-reading">↻</span>` : ""}
      ${outcomeChip(c.outcome)}
      <span class="dim">${c.reviewers.map(esc).join(", ")}${
        c.related.length ? ` · fix with ${c.related.length} other` : ""}</span>
    </div>`).join("");
  // Per round: what it found that the one before had not, and whether the fixes
  // it asked to have re-read were worth re-reading. That last one is the accuracy
  // check on the declaration — the declarer cannot mark its own homework.
  // A hit is the declaration BORNE OUT, so it reads as the good outcome: --warn
  // is this page's mark for something wrong with the review (unjudged, truncated,
  // did not run, not convergence) and must not also mean "the reviewer was right".
  const hitTitle = "file-grain, over confirmed findings on both sides: the next round in this "
    + "cycle raised a confirmed finding in a file this round flagged — not a claim that the "
    + "fix caused it";
  // Per member as well as per run: the declaration rides on the reporter's own
  // row, so who was borne out is answerable, and "honesty per reviewer" is the
  // claim this page makes. A member appears only where the payload carried
  // per-reporter accounts — nothing else on the record says who declared what.
  const byMember = r => Object.entries(r.rereview_by_reviewer || {})
    .map(([name, m]) => `${esc(name)} ${m.hit == null ? "—" : m.hit ? "✓" : "✗"}`)
    .join(", ");
  const rounds = h.runs.map(r => {
    const hit = r.rereview_hit == null ? "" :
      r.rereview_hit ? ` <span style="color:var(--good)" title="${hitTitle}">→ the next round found something there</span>`
                     : ` <span class="dim" title="${hitTitle}">→ the next round found nothing there</span>`;
    const who = byMember(r);
    return `<div class="dim">r${r.round || 1}: ${
      r.new_findings == null ? "new count not recorded" : `${r.new_findings} new`}${
      r.rereview_flagged ? ` · ${r.rereview_flagged} flagged for re-review${hit}${
        who ? ` <span title="per member that declared it: ✓ borne out, ✗ not, — nothing followed">(${who})</span>` : ""}` : ""}${
      r.stop_reason ? ` · ${r.stopped === false ? "go again" : "stop"}: ${esc(r.stop_reason)}` : ""}${
      (r.stop_veto || []).length ? ` <span style="color:var(--warn)"
        title="${esc(r.stop_veto.join(" | "))}">⚠ ${r.stop_veto.length} veto</span>` : ""}</div>`;
  }).join("");
  // The ending comes from the panel's own boolean, never from the reason string:
  // that reads as a reason to GO AGAIN just as often ("2 finding(s) no earlier
  // round raised"), and printing it under "stopped:" called a running cycle
  // finished.
  const why = (h.stop_veto || []).length
    ? ` <span class="dim" title="${esc(h.stop_veto.join(" | "))}">(${h.stop_veto.length} veto)</span>` : "";
  const ending = h.stopped === false
    ? ` · <span style="color:var(--warn)">not stopped: ${esc(h.stop_reason || "another round is due")}</span>`
    : h.stop_reason ? ` · stopped: ${esc(h.stop_reason)}${
        h.stop_confident === false
          ? ' <span style="color:var(--warn)">(not convergence)</span>' + why : ""}` : "";
  box.innerHTML = `<div class="dim" style="margin:4px 0 6px">
      ${h.rounds} run${h.rounds === 1 ? "" : "s"} on this PR${h.truncated ? " (window truncated)" : ""}
      · <b>gone</b> = raised earlier, not in the latest run${ending}
    </div>${rounds}<div style="margin-top:6px">${chains}</div>`;
}

// One member's spend on one run: whatever the vendor actually stated. The dollar
// figure is shown only where the vendor states one — this page never multiplies
// tokens by a price table, because a run priced at today's rates reads wrong the
// moment the rates move, and these rows are meant to still be true in six weeks.
function cardCost(c){
  const t = [c.input_tokens, c.output_tokens].filter(x => x != null);
  const tok = t.length ? fmtTok(t.reduce((a, b) => a + b, 0)) + " tok" : "";
  const usd = c.cost_usd != null ? fmtUsd(c.cost_usd) : "";
  return [tok, usd].filter(Boolean).join(" · ") || "—";
}

async function toggleRun(tr){
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")){ next.remove(); return; }
  const row = document.createElement("tr");
  row.className = "detail";
  row.innerHTML = `<td colspan="9" class="dim">loading…</td>`;
  tr.after(row);
  const res = await fetch(`/review/${tr.dataset.id}`, { headers: { Accept: "application/json" } });
  if (!res.ok){ row.firstChild.textContent = "could not load run"; return; }
  const r = await res.json();
  const cards = r.reviewers.map(c => `<tr>
      <td><span class="who"><span class="sw" style="background:${hue(c.name)}"></span>${esc(c.name)}
        ${c.model ? `<span class="chip">${esc(c.model)}${c.effort ? " · " + esc(c.effort) : ""}</span>` : ""}</span></td>
      <td>${c.ran ? c.raised : `<span style="color:var(--warn)">did not run</span>`}</td>
      <td>${c.confirmed}</td><td class="dim">${c.dismissed}</td><td>${c.solo}</td>
      <td class="dim">${c.duration_ms == null ? "—" : Math.round(c.duration_ms / 1000) + "s"}</td>
      <td class="dim">${cardCost(c)}</td>
      <td class="dim">${c.truncated ? `saw ${c.max_diff_chars?.toLocaleString()} chars`
                                    : "saw whole diff"}</td>
      <td class="dim" style="white-space:normal;text-align:left">${
        c.unstructured ? `<span style="color:var(--warn)"
            title="its reply carried no JSON — anything it declared was lost in the parse"
            >reply did not parse</span>`
        : c.could_not_assess == null ? "<span title='this panel was never asked'>—</span>"
        : c.could_not_assess.length ? esc(c.could_not_assess.join(" · "))
        : "nothing"}</td>
      <td class="dim">${c.rereview_flagged || 0}</td>
    </tr>`).join("");
  const finds = r.findings.map(findingBlock).join("") || '<div class="dim">no findings</div>';
  // The run's own verdict on itself, above the findings: whether it stopped
  // because there was nothing left, and what the judge made of the coverage the
  // reviewers declared.
  // The vetoes are listed, not counted: "not convergence" without them tells the
  // reader a clean verdict was not evidence and nothing about how badly.
  const vetoes = (r.stop_veto || []).length
    ? `<ul style="margin:4px 0 0 18px;padding:0">${
        r.stop_veto.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : "";
  const stop = r.stop_reason
    ? `<div style="margin-top:8px;color:${r.stop_confident === false ? "var(--warn)" : "var(--muted)"}">
         round ${r.round || 1} · ${r.stopped === false ? "go again" : "stop"}: ${esc(r.stop_reason)}${
           r.stop_confident === false ? " — not convergence" : ""}${vetoes}</div>` : "";
  const note = r.coverage_note
    ? `<div class="dim" style="margin-top:4px">master on coverage: ${esc(r.coverage_note)}</div>` : "";
  row.innerHTML = `<td colspan="9">
    <table><thead><tr><th>panel member</th><th>raised</th><th>confirmed</th>
      <th>dismissed</th><th>solo</th><th>took</th><th>cost</th><th>diff seen</th>
      <th>could not assess</th>
      <th>flagged for re-review</th></tr></thead><tbody>${cards}</tbody></table>
    ${r.skipped.length ? `<div class="dim" style="margin-top:8px">skipped: ${r.skipped.map(esc).join(" · ")}</div>` : ""}
    ${stop}${note}
    <div style="margin-top:10px">${finds}</div>
    <button class="toggle">this defect across every run of the PR →</button>
    <div class="history" hidden></div></td>`;

  // Accounts expand in place: the finding line stays the summary, and clicking
  // it shows what each reviewer said rather than navigating away from the run.
  row.querySelectorAll(".fnd.has-acct").forEach(el =>
    el.addEventListener("click", () => {
      const acc = el.nextElementSibling;
      acc.hidden = !acc.hidden;
    }));

  const box = row.querySelector(".history");
  row.querySelector(".toggle").addEventListener("click", () => {
    box.hidden = !box.hidden;
    if (!box.hidden && !box.dataset.loaded){
      box.dataset.loaded = "1";
      renderHistory(box, r.repo, r.pr);
    }
  });
}

function renderRuns(runs){
  if (!runs.length){ $("runs").innerHTML = '<div class="empty">no runs recorded yet</div>'; return; }
  $("runs").innerHTML = `<table><thead><tr>
    <th>PR</th><th>ran by</th><th>confirmed</th><th>dismissed</th><th>new</th><th>sonar</th>
    <th>CI</th><th>judge</th><th>when</th></tr></thead>
    <tbody>${runs.map(runRow).join("")}</tbody></table>`;
  $("runs").querySelectorAll(".runrow").forEach(tr =>
    tr.addEventListener("click", () => toggleRun(tr)));

  const repos = [...new Set(runs.map(r => r.repo))].sort();
  const sel = $("repo"), keep = sel.value;
  if (sel.options.length - 1 !== repos.length){
    sel.innerHTML = '<option value="">all repos</option>' +
      repos.map(r => `<option>${esc(r)}</option>`).join("");
    sel.value = keep;
  }
}

function renderTiles(s){
  $("window").textContent = s.window.since
    ? `since ${s.window.since.slice(0, 10)}`
    : (s.window.first_run ? `since ${s.window.first_run.slice(0, 10)}` : "");
  const top = s.by_model[0];
  // How much of what this loop found did it inflict on itself? Counted once per
  // finding rather than once per member that raised it, which is why it comes
  // from `by_provenance` and not from summing the leaderboard.
  //
  // Absent entirely when nothing in the window was attributable — the tile would
  // otherwise read "0%" over runs where the question was never asked, and that is
  // the most flattering possible way to say "not measured".
  //
  // Summed over what the server sent minus `not_attributed`, rather than over a
  // list of bucket names kept here: a bucket added under #41 belongs in the
  // denominator the day it exists, and a page that omits it reports a percentage
  // of the wrong total while looking exactly as confident.
  const prov = s.by_provenance || {};
  const traced = Object.entries(prov)
    .reduce((a, [k, v]) => k === "not_attributed" ? a : a + (v || 0), 0);
  const inflicted = traced ? Math.round(((prov.introduced || 0) / traced) * 100) : null;
  // What survived contact with the code (v2.37). Over `fixed + refuted` only —
  // `deferred` and `superseded` are decisions about what to do next, and putting
  // either in the denominator would let "we never got to it" count as "it was
  // real". Absent entirely until something has been scored, for the same reason
  // the tile above is: a percentage over nothing is the most confident possible
  // way to say nothing was measured.
  const out = s.by_outcome || {};
  const scored = (out.fixed || 0) + (out.refuted || 0);
  const held = scored ? Math.round(((out.fixed || 0) / scored) * 100) : null;
  // How much of the headline is self-signed. The refutations are what move this
  // percentage, `attested_by` is a CLAIM the recorder makes and not a signature
  // the board can check, and the first thing a reader sees should not be a number
  // whose provenance lives two tooltips away.
  const attested = (s.by_outcome_attested || {}).refuted || 0;
  const selfSigned = (out.refuted || 0) - attested;
  const signedOff = out.refuted
    ? ` <span style="color:${selfSigned ? "var(--warn)" : "var(--muted)"}">(${
        attested} signoff${attested === 1 ? "" : "s"} claimed)</span>` : "";
  $("tiles").innerHTML = `
    <div class="tile"><div class="n">${s.runs}</div><div class="k">panel runs</div></div>
    <div class="tile"><div class="n">${s.prs}</div><div class="k">PRs reviewed</div></div>
    <div class="tile"><div class="n">${s.repos}</div><div class="k">repos</div></div>
    <div class="tile"><div class="n">${s.by_model.reduce((a, m) => a + m.confirmed, 0)}</div>
      <div class="k">confirmed findings</div></div>
    ${top ? `<div class="tile"><div class="n" style="color:${hue(top.reviewer)}">${esc(top.reviewer)}</div>
      <div class="k">most confirmed${top.model ? " · " + esc(top.model) : ""}</div></div>` : ""}
    ${inflicted == null ? "" : `<div class="tile"><div class="n">${inflicted}%</div>
      <div class="k">introduced by the previous fix<br>
        <span class="dim">${prov.introduced || 0} of ${traced} traced · a floor</span></div></div>`}
    ${held == null ? "" : `<div class="tile"><div class="n" style="color:${precColor(held / 100)}">${held}%</div>
      <div class="k">held up after the fix<br>
        <span class="dim">${out.fixed || 0} fixed · ${out.refuted || 0} refuted${
          signedOff}<br>${out.deferred || 0} deferred · ${out.superseded || 0} superseded
          · ${out.not_recorded || 0} unruled</span></div></div>`}`;
}

async function load(){
  const judgedOnly = $("judged").checked;
  const [statsRes, runsRes] = await Promise.all([
    fetch("/review/stats?" + qs({ judged_only: judgedOnly }), { headers: { Accept: "application/json" } }),
    fetch("/reviews?" + qs({ limit: 50 }), { headers: { Accept: "application/json" } }),
  ]);
  if (!statsRes.ok || !runsRes.ok){
    $("leaderboard").innerHTML = '<div class="empty">could not load review stats</div>';
    return;
  }
  const stats = await statsRes.json();
  renderTiles(stats);
  renderLeaderboard(stats.by_model, judgedOnly);
  renderAgents(stats.by_agent);
  renderRuns(await runsRes.json());
}

["repo", "days", "judged"].forEach(id => $(id).addEventListener("change", load));
load();
</script>
</body>
</html>
