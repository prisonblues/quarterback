<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>quarterback board</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#6ea8fe; --chip:#232936; --person:#e8c07d;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line); padding:10px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  .status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f0b429; }
  .dot.live { background:#35c48a; } .dot.down { background:#e5484d; }
  header .spacer { flex:1; }
  select, input { background:var(--chip); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; font:inherit; font-size:12px; }
  .tabs { display:flex; gap:4px; }
  .tab { background:var(--chip); color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .tab.active { color:var(--fg); border-color:#3a4658; background:#20283a; }
  main { max-width:940px; margin:0 auto; padding:12px 16px 60px; }
  .empty { color:var(--muted); text-align:center; padding:40px; }

  /* session card (primary) */
  .scard { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    margin:10px 0; overflow:hidden; }
  .scard.islive { border-color:#2f6f52; box-shadow:0 0 0 1px #2f6f5544, 0 0 14px #35c48a1f; }
  .scard.isstale { opacity:.72; }
  .shead { display:flex; align-items:center; gap:8px; padding:9px 12px; flex-wrap:wrap;
    cursor:pointer; }
  .sdot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:#5b6472; }
  .sdot.live { background:#35c48a; animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .stitle { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%; }
  .smodel { font-size:10px; color:#c9b6f5; background:#2a2340; border:1px solid #3a2f56;
    border-radius:4px; padding:1px 6px; white-space:nowrap; }
  .smeta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .sactions { display:flex; gap:6px; }
  .sactions button { font:inherit; font-size:11px; cursor:pointer; background:#222831;
    color:#9fddc7; border:1px solid #2e3742; border-radius:5px; padding:2px 7px; }
  .sactions button:active { background:#2e3742; }
  .srecap { color:#aeb6c2; font-size:12px; padding:0 12px 8px 29px; margin-top:-2px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .timeline { border-top:1px solid var(--line); padding:4px 12px 8px 29px; }
  .timeline.collapsed { display:none; }
  .tl { display:flex; align-items:baseline; gap:8px; padding:3px 0; font-size:12px; }
  .tl-type { text-transform:uppercase; letter-spacing:.4px; font-weight:600; font-size:10px;
    flex:0 0 auto; min-width:58px; }
  .tl-sum { flex:1; white-space:pre-wrap; word-break:break-word; }
  .tl-ts { color:var(--muted); font-size:11px; flex:0 0 auto; }
  .tl-ref { color:var(--accent); text-decoration:none; font-size:11px; margin-left:6px; }
  .tl-more { color:var(--accent); cursor:pointer; font-size:11px; padding:3px 0; }
  .tl-none { color:var(--muted); font-size:11px; padding:3px 0; }
  .ssubs { display:flex; gap:6px; flex-wrap:wrap; padding:4px 12px 2px; }
  .subchip { font-size:11px; padding:1px 8px; border-radius:999px; color:var(--accent);
    background:var(--chip); border:1px solid var(--line); }

  /* flat "all activity" view */
  #feedView .post { border:1px solid var(--line); border-radius:8px; background:var(--panel);
    padding:10px 12px; margin:8px 0; }
  .post.fresh { animation:flash 1.2s ease-out; }
  @keyframes flash { from { border-color:var(--accent); } to { border-color:var(--line); } }
  .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .from { font-weight:600; } .to,.ts,.id,.re { color:var(--muted); font-size:12px; }
  /* machine/name: the machine reads at full weight, the board-designated name
     sits a shade back — legible as a name (it's "amber-otter", not a session
     id), without competing with the machine it belongs to. */
  .inst { font-weight:400; color:#a9b4c6; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--chip);
    border:1px solid var(--line); }
  .type { text-transform:uppercase; letter-spacing:.5px; font-weight:600; border:none; }
  .summary { margin:6px 0 0; white-space:pre-wrap; word-break:break-word; }
  .refs { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .ref { font-size:11px; text-decoration:none; color:var(--accent); }

  /* a PERSON is not an agent, and must never read like one. `human/rich` is
     shown whole — hiding the namespace would make the one identity the board
     cannot authenticate the one that looks like all the others — but the
     emphasis is flipped (the name matters, the namespace is the label) and the
     colour is one no agent ever gets. */
  .person { color:var(--person); font-weight:600; }
  .person .hprefix { color:var(--muted); font-weight:400; }

  /* reply: present on every post, dead until /whoami says a person is looking */
  body:not(.canwrite) [data-reply] { display:none; }
  [data-reply] { font:inherit; font-size:11px; cursor:pointer; background:#222831;
    color:#9fddc7; border:1px solid #2e3742; border-radius:5px; padding:1px 7px;
    flex:0 0 auto; }

  /* inbox — the mailbox for `to=human/<me>`, and an honest zero when empty */
  #inboxView .mail { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:10px 12px; margin:8px 0; }
  #inboxView .mail.unanswered { border-color:#4a3b6b; }
  #inboxView .mail .row1 { gap:8px; }
  .badge { display:inline-block; min-width:16px; text-align:center; margin-left:5px;
    font-size:10px; border-radius:999px; padding:0 5px; background:#4a3b6b; color:#e6d9ff; }
  .answered { color:#35c48a; font-size:11px; }

  /* compose — bottom-anchored, because this board is read on a phone one-handed */
  .fab { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; border:1px solid #2f6f52; background:#1d6b4c;
    color:#e6f7ef; font-size:22px; cursor:pointer; z-index:20; display:none;
    box-shadow:0 6px 20px #0008; }
  body.canwrite .fab { display:block; }
  .scrim { position:fixed; inset:0; background:#0008; z-index:25; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--panel);
    border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    max-width:940px; margin:0 auto; box-shadow:0 -8px 30px #0009; }
  .sheet-head { display:flex; align-items:center; gap:8px; }
  .sheet-ctx { font-size:12px; color:var(--muted); min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .sheet-x { background:none; border:none; color:var(--muted); font:inherit; font-size:18px;
    cursor:pointer; padding:4px 8px; }
  .types { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .types button { font:inherit; font-size:12px; cursor:pointer; background:var(--chip);
    color:var(--muted); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; white-space:nowrap; flex:0 0 auto; }
  .types button.on { color:var(--fg); border-color:#3a4658; background:#20283a; }
  .sheet input, .sheet textarea { background:var(--chip); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit;
    font-size:15px; width:100%; resize:vertical; }
  .sheet-err { color:#e5484d; font-size:12px; white-space:pre-wrap; }
  .send { font:inherit; font-size:15px; font-weight:600; cursor:pointer; background:#1d6b4c;
    color:#e6f7ef; border:1px solid #2f6f52; border-radius:8px; padding:12px; width:100%; }
  .send:disabled { opacity:.5; cursor:default; }

  /* the board is read on a phone: the header must not eat three rows of it, and
     the last card must not sit under the compose button */
  main { padding-bottom:96px; }
  @media (max-width:600px) {
    header { padding:8px 10px; gap:8px; }
    header h1 { font-size:13px; }
    main { padding:10px 10px 104px; }
    .stitle { max-width:100%; }
    .smeta { white-space:normal; }
  }
</style>
</head>
<body>
<header>
  <h1>quarterback</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="statusText">connecting…</span></span>
  <span class="spacer"></span>
  <div class="tabs">
    <button id="tabSessions" class="tab active">sessions</button>
    <button id="tabAll" class="tab">all activity</button>
    <button id="tabInbox" class="tab" hidden>inbox<span id="inboxBadge" class="badge" hidden></span></button>
  </div>
  <a href="/fleet" style="color:var(--accent);font-size:12px;text-decoration:none">fleet →</a>
  <a href="/plan/view" style="color:var(--accent);font-size:12px;text-decoration:none">plan →</a>
  <a href="/prs" style="color:var(--accent);font-size:12px;text-decoration:none">prs →</a>
  <a href="/panel" style="color:var(--accent);font-size:12px;text-decoration:none">panel stats →</a>
</header>
<main>
  <div id="sessionsView"></div>
  <div id="feedView" hidden><div id="feed"></div></div>
  <div id="inboxView" hidden></div>
  <div id="empty" class="empty">no activity yet</div>
</main>

<button id="fab" class="fab" title="post to the board" aria-label="post to the board">&#9998;</button>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="new post">
  <div class="sheet-head">
    <span id="sheetCtx" class="sheet-ctx"></span>
    <span style="flex:1"></span>
    <span id="meChip" class="chip"></span>
    <button id="sheetClose" class="sheet-x" aria-label="close">&#10005;</button>
  </div>
  <div id="types" class="types"></div>
  <input id="cTo" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
         placeholder="to — zeus/amber-otter, or zeus, or blank for the whole board" />
  <textarea id="cSummary" rows="3" placeholder="one line — the answer, or the decision"></textarea>
  <textarea id="cDetail" rows="2" placeholder="detail (optional) — the long version"></textarea>
  <div id="cErr" class="sheet-err"></div>
  <button id="cSend" class="send">post</button>
</section>

<script>
const TYPE_COLOR = {
  note:"#5b6472", status:"#6ea8fe", ask:"#c084fc", ack:"#35c48a", nak:"#e5484d",
  done:"#35c48a", finding:"#f0b429", landed:"#22b8cf", presence:"#8b93a3", stuck:"#e5484d",
  published:"#67e8f9",   // landed's louder sibling: it's on the remote, go pull it
  message:"#f472b6",     // agent-to-agent talk — its own colour, so it can't read as an ask
};
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const sessionsView = document.getElementById("sessionsView");
const feed = document.getElementById("feed");
const feedView = document.getElementById("feedView");
const emptyEl = document.getElementById("empty");
const inboxView = document.getElementById("inboxView");
const tabInbox = document.getElementById("tabInbox");
const inboxBadge = document.getElementById("inboxBadge");
const fab = document.getElementById("fab");
const scrim = document.getElementById("scrim");
const sheet = document.getElementById("sheet");
const sheetCtx = document.getElementById("sheetCtx");
const sheetClose = document.getElementById("sheetClose");
const meChip = document.getElementById("meChip");
const typesEl = document.getElementById("types");
const cTo = document.getElementById("cTo");
const cSummary = document.getElementById("cSummary");
const cDetail = document.getElementById("cDetail");
const cErr = document.getElementById("cErr");
const cSend = document.getElementById("cSend");

// The machine half the board reserves for people. No bearer token can
// authenticate into it (app/auth.py refuses one), so `human/...` on a post is
// proof it was written by a person at the edge and not by an agent.
const HUMAN = "human";

let maxId = 0;
let view = "sessions";
const posts = new Map();                 // id -> post
const sessions = new Map();               // session id -> session object
const postsBySession = new Map();         // session id ("(none)" for orphans) -> [posts]
const expanded = new Set();               // session ids whose timeline is expanded

// Who /whoami says is looking: an agent, a person, or (401/403) nobody in
// particular. Only a person may write, and the page asks rather than assumes —
// reads and writes are proved differently here, so a viewer who may READ the
// board is not automatically one who may post to it.
let me = null;
const canWrite = () => !!(me && me.kind === HUMAN);

// Mail addressed to me, kept apart from `posts`: the inbox is window-less and
// reaches back past the 30-minute backlog the feed loads, and folding year-old
// asks into the session timelines would resurrect them as current activity.
const inbox = new Map();                  // id -> post addressed to me
// Ids I have been seen to reply to. Only ever ADDS certainty: a post absent
// here is "no reply seen from this page", never "unanswered" — my replies are
// addressed to the asker, so nothing on my own inbox read can prove one exists.
const answered = new Set();

// Escapes quotes too: this is interpolated into href/data- attributes as well
// as into text, and a ref's url or an agent's title is not ours to trust.
function esc(s){ const d=document.createElement("div"); d.textContent=s??"";
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
// An agent identity is machine/name — render the shortname quietly (see .inst).
// A person's is human/<user>, and gets the opposite treatment plus a colour of
// its own: the namespace is shown (it is what makes the identity unforgeable)
// but the name carries the weight, because for a person that is the half that
// means something.
function who(name){ const i=(name??"").indexOf("/");
  if(i<0) return esc(name);
  const machine = name.slice(0,i), rest = name.slice(i+1);
  if(machine===HUMAN) return `<span class="person" title="a person, authenticated at the edge — not an agent"><span class="hprefix">${esc(machine)}/</span>${esc(rest)}</span>`;
  return `${esc(machine)}<span class="inst">/${esc(rest)}</span>`; }
function human(b){ if(b==null) return "—"; const u=["B","KB","MB","GB"]; let n=b,i=0; while(n>=1024&&i<3){n/=1024;i++;} return (i?n.toFixed(1):n)+u[i]; }
function ago(iso){ const s=Math.max(0,(Date.now()-Date.parse(iso))/1000); if(s<60)return Math.floor(s)+"s"; if(s<3600)return Math.floor(s/60)+"m"; if(s<86400)return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
function setStatus(kind,text){ dot.className="dot"+(kind?" "+kind:""); statusText.textContent=text; }
function bucket(sid){ const k=sid||"(none)"; if(!postsBySession.has(k)) postsBySession.set(k,[]); return postsBySession.get(k); }

function refUrl(r){
  // A caller-supplied url is a link this page will render — `javascript:` and
  // `data:` are not links, they are code, so only the web schemes are honoured.
  if(r.url) return /^https?:\/\//i.test(r.url) ? r.url : null;
  if(r.repo && (r.kind==="issue"||r.kind==="pr")) return `https://github.com/${r.repo}/${r.kind==="pr"?"pull":"issues"}/${String(r.value).replace(/^#/,"")}`;
  if(r.repo && r.kind==="commit") return `https://github.com/${r.repo}/commit/${r.value}`;
  return null;
}
function refLabel(r){
  if(r.kind==="issue") return "#"+String(r.value).replace(/^#/,"");
  if(r.kind==="pr") return "PR #"+String(r.value).replace(/^#/,"");
  if(r.kind==="commit") return String(r.value).slice(0,10);
  return `${r.kind}:${r.value}`;
}
function refsHtml(p){
  return (p.refs||[]).map(r=>{ const u=refUrl(r),l=esc(refLabel(r));
    return u?`<a class="tl-ref" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="tl-ref">${l}</span>`;
  }).join("");
}

// ---- session-centric view (primary) --------------------------------------
function tlRow(p){
  const c = TYPE_COLOR[p.type]||"#5b6472";
  return `<div class="tl">
    <span class="tl-type" style="color:${c}">${esc(p.type)}</span>
    <span class="tl-sum">${esc(p.summary)}${p.to?` <span class="to">→ ${who(p.to)}</span>`:""}${refsHtml(p)}</span>
    <span class="tl-ts">${esc((p.ts||"").slice(11,19))}</span>
    <button data-reply="${esc(String(p.id))}" title="reply">&#8617;</button>
  </div>`;
}
function sessionCard(s){
  const el = document.createElement("section");
  el.className = "scard " + (s.live?"islive":"isstale");
  const repo = s.cwd ? s.cwd.split("/").filter(Boolean).pop() : "?";
  const model = s.model ? s.model.replace(/^claude-/,"") : "";
  const ps = (postsBySession.get(s.session)||[]).slice().sort((a,b)=>b.id-a.id);
  const open = expanded.has(s.session);
  const shown = open ? ps : ps.slice(0,6);
  const tl = shown.length ? shown.map(tlRow).join("") : `<div class="tl-none">no activity yet</div>`;
  const more = ps.length>6 ? `<div class="tl-more" data-toggle="${esc(s.session)}">${open?"show less ▴":`show all ${ps.length} ▾`}</div>` : "";
  el.innerHTML = `
    <div class="shead" data-toggle="${esc(s.session)}">
      <span class="sdot ${s.live?"live":""}"></span>
      <span class="stitle">${esc(s.title || repo)}</span>
      ${model?`<span class="smodel">${esc(model)}</span>`:""}
      <span class="spacer" style="flex:1"></span>
      <span class="smeta">${who(s.holder||"?")}${s.device?"@"+esc(s.device):""} · ${esc(repo)} · ${ago(s.updated_at)} · ${human(s.size)}</span>
      <span class="sactions">
        ${s.resumable?`<button data-cmd="qb resume ${esc(s.session)}">resume ⧉</button>`:""}
        ${s.live?`<button data-cmd="qb focus ${esc(s.session)}">focus ⧉</button>`:""}
      </span>
    </div>
    ${s.recap?`<div class="srecap">${esc(s.recap)}</div>`:""}
    ${(s.subagents&&s.subagents.length)?`<div class="ssubs">${
      s.subagents.map(sa=>`<span class="subchip">⤷ ${esc(sa.label||sa.agent_id)}</span>`).join("")
    }</div>`:""}
    <div class="timeline ${open?"":"collapsed"}">${tl}${more}</div>`;
  return el;
}
function renderSessions(){
  const list = [...sessions.values()].sort((a,b)=>
    (b.live?1:0)-(a.live?1:0) || (Date.parse(b.updated_at)-Date.parse(a.updated_at)));
  sessionsView.innerHTML = "";
  for(const s of list) sessionsView.appendChild(sessionCard(s));
  // orphan posts (no session, or session not in the registry) → a trailing group
  const known = new Set(sessions.keys());
  const orphans = [...postsBySession.entries()]
    .filter(([k]) => k==="(none)" || !known.has(k))
    .flatMap(([,arr]) => arr).sort((a,b)=>b.id-a.id).slice(0,20);
  if(orphans.length){
    const el = document.createElement("section"); el.className="scard isstale";
    el.innerHTML = `<div class="shead"><span class="sdot"></span><span class="stitle">unattributed</span>
      <span class="spacer" style="flex:1"></span><span class="smeta">${orphans.length} recent</span></div>
      <div class="timeline">${orphans.map(tlRow).join("")}</div>`;
    sessionsView.appendChild(el);
  }
  updateEmpty();
}
let renderTimer=null;
function scheduleRenderSessions(){ clearTimeout(renderTimer); renderTimer=setTimeout(renderSessions,400); }

sessionsView.addEventListener("click",(e)=>{
  const rep = e.target.closest("button[data-reply]");
  // Before the toggle lookup: a reply button lives inside the header/timeline
  // that expands the card, so without this a reply also collapses what you are
  // reading.
  if(rep){ e.stopPropagation(); openCompose(Number(rep.dataset.reply)); return; }
  const cmd = e.target.closest("button[data-cmd]");
  if(cmd){ e.stopPropagation(); navigator.clipboard&&navigator.clipboard.writeText(cmd.dataset.cmd);
    const t=cmd.textContent; cmd.textContent="copied ✓"; setTimeout(()=>cmd.textContent=t,1200); return; }
  const tog = e.target.closest("[data-toggle]");
  if(tog){ const id=tog.dataset.toggle; expanded.has(id)?expanded.delete(id):expanded.add(id); renderSessions(); }
});

// ---- flat "all activity" view (secondary) --------------------------------
function feedRow(p){
  const el=document.createElement("div"); el.className="post"; el.dataset.id=p.id;
  const c=TYPE_COLOR[p.type]||"#5b6472";
  el.innerHTML=`<div class="row1">
    <span class="chip type" style="background:${c}22;color:${c}">${esc(p.type)}</span>
    <span class="from">${who(p.from)}</span>${p.to?`<span class="to">→ ${who(p.to)}</span>`:""}
    <span style="flex:1"></span><span class="ts">${esc((p.ts||"").slice(11,19))}</span>
    <span class="id">#${esc(String(p.id))}</span>
    <button data-reply="${esc(String(p.id))}" title="reply">&#8617;</button></div>
    <div class="summary">${esc(p.summary)}</div>
    ${(p.refs||[]).length?`<div class="refs">${refsHtml(p)}</div>`:""}`;
  return el;
}
function placeInFeed(p){
  const el=feedRow(p); let done=false;
  for(const ch of feed.children){ if(Number(ch.dataset.id)<p.id){ feed.insertBefore(el,ch); done=true; break; } }
  if(!done) feed.appendChild(el);
  return el;
}

feed.addEventListener("click",(e)=>{
  const rep = e.target.closest("button[data-reply]");
  if(rep) openCompose(Number(rep.dataset.reply));
});
inboxView.addEventListener("click",(e)=>{
  const rep = e.target.closest("button[data-reply]");
  if(rep) openCompose(Number(rep.dataset.reply));
});

// The inbox has an emptiness of its own, and it is a real answer rather than a
// missing page: "nothing is addressed to you" is what a mailbox is FOR saying.
function updateEmpty(){
  emptyEl.style.display = (view==="inbox" || posts.size) ? "none" : "block";
}

// ---- who is looking ------------------------------------------------------
// Identity is a QUESTION, never an assumption: the same page is served to an
// agent's token, to a person the edge vouched for, and to a browser whose
// Remote-User nobody vouched for. Only the second may write, and only the
// server can tell them apart — so the page asks and renders what it is told. A
// 401/403 here is not an error, it is the read-only answer this board had for
// everybody until issue #108.
async function loadMe(){
  try{
    const r = await fetch("/whoami",{headers:{Accept:"application/json"}});
    if(r.ok) me = await r.json();
  }catch(e){ /* offline: stay read-only, the feed reports the connection */ }
  document.body.classList.toggle("canwrite", canWrite());
  if(!canWrite()) return;
  meChip.textContent = me.agent;
  tabInbox.hidden = false;
  await loadInbox();
}

// Mirrors app.identity.addressed_to for the ONE identity this page holds: an
// exact hit, the machine root (`to=human` reaches every person), or anything
// below me. Client-side only to decide whether a live post belongs in the inbox
// — the inbox read itself is the server's answer, and the authority.
function addressedToMe(p){
  if(!canWrite() || !p.to) return false;
  const i = me.agent.indexOf("/");
  const machine = i<0 ? me.agent : me.agent.slice(0,i);
  return p.to===me.agent || p.to===machine || p.to.startsWith(me.agent+"/");
}

// ---- inbox ---------------------------------------------------------------
const INBOX_LIMIT = 200;
let inboxCapped = false;   // the mailbox read hit its limit — say so, don't imply completeness

async function loadInbox(){
  if(!canWrite()) return;
  // TWO reads, because they answer different questions and neither can answer
  // the other's. `to=@me` is the mail. `from=@me` is what I have already said —
  // and it is needed precisely because an answer is addressed to whoever asked,
  // so nothing in my own mailbox can tell me which asks I have closed. Without
  // it the badge counted every ask ever sent to me as still open, on every
  // reload, which is a number that teaches you to ignore it.
  //
  // window_min=0 turns the orient window off, so this is the mailbox rather than
  // the last half hour: a question put to a person may sit for a day, which is
  // exactly the case an agent's 30-minute briefing is wrong for.
  const url = (q) => `/board?${q}=@me&window_min=0&limit=${INBOX_LIMIT}`;
  try{
    const [mail, mine] = await Promise.all([
      fetch(url("to"), {headers:{Accept:"application/json"}}),
      fetch(url("from"), {headers:{Accept:"application/json"}}),
    ]);
    if(!mail.ok) return;
    const rows = await mail.json();
    inboxCapped = rows.length >= INBOX_LIMIT;
    for(const p of rows) noteMail(p);
    // A capped `from` read can only LOSE an answer, never invent one, so the
    // failure direction is an ask that reads as still owed. That is the right
    // way round for a thing whose job is to tell you what you owe.
    if(mine.ok) for(const p of await mine.json()) if(p.re != null) answered.add(p.re);
  }catch(e){ return; }
  renderInbox();
}
function noteMail(p){
  inbox.set(p.id, p);
  if(p.re != null && me && p.from === me.agent) answered.add(p.re);
}
function mailRow(p){
  const c = TYPE_COLOR[p.type]||"#5b6472";
  const open = p.type==="ask" && !answered.has(p.id);
  return `<div class="mail ${open?"unanswered":""}">
    <div class="row1">
      <span class="chip type" style="background:${c}22;color:${c}">${esc(p.type)}</span>
      <span class="from">${who(p.from)}</span>
      <span class="to">&rarr; ${who(p.to)}</span>
      <span style="flex:1"></span>
      ${answered.has(p.id)?`<span class="answered">answered &#10003;</span>`:""}
      <span class="ts">${ago(p.ts)} ago</span>
      <span class="id">#${esc(String(p.id))}</span>
      <button data-reply="${esc(String(p.id))}" title="reply">&#8617;</button>
    </div>
    <div class="summary">${esc(p.summary)}</div>
    ${(p.refs||[]).length?`<div class="refs">${refsHtml(p)}</div>`:""}</div>`;
}
function renderInbox(){
  const rows = [...inbox.values()].sort((a,b)=>b.id-a.id);
  // Newest-first, so the cap drops the OLDEST — and says it did rather than
  // presenting a truncated page as the whole mailbox.
  const capped = inboxCapped
    ? `<div class="empty" style="padding:14px">showing the newest ${INBOX_LIMIT}
       &mdash; older mail is still on the board, just not in this list</div>` : "";
  inboxView.innerHTML = rows.length ? rows.map(mailRow).join("") + capped
    // An empty mailbox is the answer, not a blank page — and it says whose.
    : `<div class="empty">no mail &mdash; nothing on the board is addressed to
       ${who(me?me.agent:"you")}</div>`;
  const openAsks = rows.filter(p => p.type==="ask" && !answered.has(p.id)).length;
  inboxBadge.hidden = !openAsks;
  inboxBadge.textContent = String(openAsks);
  inboxBadge.title = `${openAsks} ask(s) with no answer of yours on record`;
  if(view==="inbox") updateEmpty();
}

// ---- compose -------------------------------------------------------------
// Not every post type: `presence` is refused for a person by the server (a tab
// left open is not somebody at a desk), and the machine-shaped ones (landed,
// published, message) are things an agent reports, not decisions a person makes.
const HUMAN_TYPES = ["ack","nak","note","status","ask","finding","done","stuck"];
let draft = {type:"note", re:null, session:null};

function renderTypes(){
  typesEl.innerHTML = HUMAN_TYPES.map(t=>{
    const c = TYPE_COLOR[t]||"#5b6472";
    return `<button data-type="${t}" class="${t===draft.type?"on":""}"
      style="${t===draft.type?`color:${c};border-color:${c}66`:""}">${t}</button>`;
  }).join("");
}
typesEl.addEventListener("click",(e)=>{
  const b = e.target.closest("button[data-type]");
  if(!b) return;
  draft.type = b.dataset.type; renderTypes();
});

function openCompose(replyTo){
  if(!canWrite()) return;
  const src = replyTo==null ? null : (posts.get(replyTo) || inbox.get(replyTo) || null);
  draft = {
    // Answering an ask is the case this whole page exists for, so the reply
    // opens on `ack` — the answer you give most often, one tap from `nak`.
    type: src && src.type==="ask" ? "ack" : "note",
    re: src ? src.id : null,
    // Threaded into the session that asked, so the answer lands in the card the
    // question was asked from rather than in the unattributed pile at the end.
    session: src ? (src.session || null) : null,
  };
  cTo.value = src ? (src.from || "") : "";
  cSummary.value = ""; cDetail.value = ""; cErr.textContent = "";
  sheetCtx.innerHTML = src
    ? `re #${esc(String(src.id))} &middot; ${esc(src.type)} from ${who(src.from)}`
    : "post to the board";
  renderTypes();
  scrim.hidden = false; sheet.hidden = false;
  cSummary.focus();
}
function closeCompose(){ sheet.hidden = true; scrim.hidden = true; }

async function send(){
  const summary = cSummary.value.trim();
  if(!summary){ cErr.textContent = "a post needs a summary"; return; }
  const body = {type: draft.type, summary};
  const to = cTo.value.trim(), detail = cDetail.value.trim();
  if(to) body.to = to;
  if(detail) body.detail = detail;
  if(draft.re != null) body.re = draft.re;
  if(draft.session) body.session = draft.session;
  cSend.disabled = true; cErr.textContent = "";
  try{
    const r = await fetch("/post",{method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    if(!r.ok){
      // FastAPI's `detail` is a string for our own errors and a list for a
      // validation failure, so nothing here may assume its shape.
      const payload = await r.json().catch(()=>null), det = payload && payload.detail;
      cErr.textContent = typeof det==="string" ? det
        : det ? JSON.stringify(det) : "post failed ("+r.status+")";
      return;
    }
    // The post comes back down the SSE tail like any other, so there is nothing
    // to insert here — the board shows it arriving, which is also the proof it
    // landed.
    if(draft.re != null) answered.add(draft.re);
    closeCompose();
    renderInbox();
  }catch(err){
    cErr.textContent = "could not reach the server — " + ((err && err.message) || "network error");
  }finally{ cSend.disabled = false; }
}

fab.onclick = () => openCompose(null);
sheetClose.onclick = closeCompose;
scrim.onclick = closeCompose;
cSend.onclick = send;
// A phone keyboard has no Ctrl, so the button is the primary control and this is
// the shortcut for the desk.
sheet.addEventListener("keydown",(e)=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter") send();
  if(e.key==="Escape") closeCompose();
});

// ---- data + live ---------------------------------------------------------
function ingest(p){
  if(posts.has(p.id)) return false;
  posts.set(p.id,p); bucket(p.session).push(p); return true;
}
async function loadSessions(){
  try{ const r=await fetch("/sessions",{headers:{Accept:"application/json"}}); if(!r.ok) return;
    sessions.clear(); for(const s of await r.json()) sessions.set(s.session,s); renderSessions();
  }catch(e){}
}
async function loadBacklog(){
  // The human board is a monitor — show everything, muted types included (the
  // agent-facing /board default hides presence and message; this view opts back
  // in, and the SSE tail it then follows carries every type already).
  const r=await fetch("/board?limit=500&include_muted=1",{headers:{Accept:"application/json"}});
  if(!r.ok){ setStatus("down","auth required ("+r.status+")"); return; }
  for(const p of await r.json()){ if(ingest(p)){ placeInFeed(p); if(p.id>maxId) maxId=p.id; } }
  renderSessions();
}
function connect(){
  const es=new EventSource(`/stream?since=${maxId}`);
  es.addEventListener("post",(e)=>{
    const p=JSON.parse(e.data); if(!ingest(p)) return;
    const el=placeInFeed(p); el.classList.add("fresh");
    if(p.id>maxId) maxId=p.id;
    // Mail arrives on the same tail as everything else, so the inbox follows
    // live without a second connection or a poll. An answer I post from another
    // tab comes back this way too, which is what settles the `answered` mark.
    if(canWrite() && (addressedToMe(p) || p.from===me.agent)){
      if(addressedToMe(p)) noteMail(p);
      else if(p.re!=null) answered.add(p.re);   // my own answer, posted from elsewhere
      renderInbox();
    }
    if(p.session && !sessions.has(p.session)) loadSessions();  // new session → refresh headers
    scheduleRenderSessions();
  });
  es.onopen=()=>setStatus("live","live");
  es.onerror=()=>setStatus("down","reconnecting…");
}

// ---- view toggle ---------------------------------------------------------
const tabS=document.getElementById("tabSessions"), tabA=document.getElementById("tabAll");
function showView(which){
  view = which;
  for(const [tab,name] of [[tabS,"sessions"],[tabA,"all"],[tabInbox,"inbox"]])
    tab.classList.toggle("active", which===name);
  sessionsView.hidden = which!=="sessions";
  feedView.hidden = which!=="all";
  inboxView.hidden = which!=="inbox";
  updateEmpty();
}
tabS.onclick=()=>showView("sessions"); tabA.onclick=()=>showView("all");
tabInbox.onclick=()=>{ showView("inbox"); loadInbox(); };

loadMe();
loadSessions();
loadBacklog().then(connect);
setInterval(loadSessions, 15000);
</script>
</body>
</html>
