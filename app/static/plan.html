<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>quarterback plan</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#6ea8fe; --chip:#232936;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line); padding:10px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .spacer { flex:1; }
  select, input { background:var(--chip); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; font:inherit; font-size:12px; }
  a { color:var(--accent); }
  main { max-width:940px; margin:0 auto; padding:12px 16px 60px; }
  .empty { color:var(--muted); text-align:center; padding:40px; }
  .counts { color:var(--muted); font-size:12px; }
  .next { border:1px solid #2f6f52; background:#141d19; border-radius:10px;
    padding:10px 12px; margin:10px 0 16px; }
  .next .lbl { color:#35c48a; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }

  .item { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:9px 12px; margin:8px 0; display:flex; gap:10px; align-items:flex-start; }
  .item.claimed { border-color:#3a4658; }
  .item.blocked { opacity:.72; }
  .item.done, .item.dropped { opacity:.5; }
  .rank { color:var(--muted); font-size:12px; min-width:2.2em; text-align:right; padding-top:1px; }
  .body { flex:1; min-width:0; }
  .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .title { font-weight:600; }
  .note { color:#aeb6c2; font-size:12px; margin-top:3px; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:11px; margin-top:3px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--chip);
    border:1px solid var(--line); color:var(--muted); }
  .chip.hold { color:#9fddc7; border-color:#2e5c48; }
  .chip.block { color:#f0b429; border-color:#5c4a1e; }
  .chip.stale { color:#e5484d; border-color:#5c2626; }
  .chip.phase { color:#c9b6f5; border-color:#3a2f56; }
  .acts { display:flex; gap:4px; }
  .acts button { font:inherit; font-size:11px; cursor:pointer; background:#222831;
    color:#9fddc7; border:1px solid #2e3742; border-radius:5px; padding:1px 7px; }
  .acts button:disabled { opacity:.35; cursor:default; }
  #err { color:#e5484d; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>plan</h1>
  <select id="repo"></select>
  <label class="counts"><input type="checkbox" id="showDone" /> show done</label>
  <span id="counts" class="counts"></span>
  <span class="spacer"></span>
  <span id="err"></span>
  <a href="/" style="font-size:12px;text-decoration:none">← board</a>
</header>
<main>
  <div id="next"></div>
  <div id="list"></div>
  <div id="empty" class="empty">nothing in the plan yet</div>
</main>

<script>
// The plan is ordered by a HUMAN — this page is the place that happens, which is
// why it can reorder and an agent's API token cannot (see app.auth.human).
const listEl = document.getElementById("list");
const nextEl = document.getElementById("next");
const emptyEl = document.getElementById("empty");
const countsEl = document.getElementById("counts");
const errEl = document.getElementById("err");
const repoSel = document.getElementById("repo");
const showDone = document.getElementById("showDone");

let items = [];        // as returned, in plan order
let repos = new Set(); // every repo scope seen, so the filter can be built from data

// Safe in an ATTRIBUTE as well as in text: textContent→innerHTML escapes & < >
// and leaves quotes alone, and every value here (repo, ref, title, note) is
// agent-supplied — so a title carrying a double quote would otherwise break out
// of the href it is interpolated into.
function esc(s){ const d=document.createElement("div"); d.textContent=s??"";
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function who(name){ const i=(name??"").indexOf("/");
  return i<0 ? esc(name) : `${esc(name.slice(0,i))}<span style="color:#a9b4c6">/${esc(name.slice(i+1))}</span>`; }
function span(s){ if(s<60)return Math.floor(s)+"s"; if(s<3600)return Math.floor(s/60)+"m";
  if(s<86400)return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
function ago(iso){ return span(Math.max(0,(Date.now()-Date.parse(iso))/1000)); }
// A claim's expiry is in the FUTURE — running it through `ago` clamps it to
// zero and every live claim reads "expires 0s", which is precisely the claim
// that has lapsed.
function until(iso){ const s=(Date.parse(iso)-Date.now())/1000;
  return s<=0 ? "lapsed" : "in "+span(s); }
function refUrl(it){ return (it.repo && it.ref && it.ref.kind)
  ? `https://github.com/${it.repo}/${it.ref.kind==="pr"?"pull":"issues"}/${it.ref.value}` : null; }
function refLabel(it){ return it.ref ? (it.ref.kind==="pr"?"PR #":"#")+it.ref.value : null; }
function say(msg){ errEl.textContent = msg||""; }

// The scope being reordered is EXACT — fleet items are their own list, so a
// reorder of "prisonblues/quarterback" can never renumber them by accident.
function scope(){ const v = repoSel.value; return v==="(fleet)" ? null : (v==="(all)" ? undefined : v); }
function inScope(it){ const s = scope(); return s===undefined ? true : it.repo===s; }

function row(it){
  const el = document.createElement("div");
  const held = it.claim, blocked = (it.blocked_by||[]).length;
  el.className = "item " + it.state + (held?" claimed":"") + (blocked?" blocked":"");
  const url = refUrl(it);
  el.innerHTML = `
    <div class="rank">${it.state==="open"?it.rank:"·"}</div>
    <div class="body">
      <div class="row1">
        ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(refLabel(it))}</a>`:""}
        <span class="title">${esc(it.title)}</span>
        ${it.phase?`<span class="chip phase">${esc(it.phase)}</span>`:""}
        ${held?`<span class="chip hold">held by ${who(held.holder)} · expires ${until(held.expires)}</span>`:""}
        ${blocked?`<span class="chip block">waiting on ${it.blocked_by.map(b=>esc(b.ref?("#"+b.ref):b.title)).join(", ")}</span>`:""}
        ${it.stale?`<span class="chip stale">stale ${it.idle_days}d</span>`:""}
        ${it.state!=="open"?`<span class="chip">${esc(it.state)}</span>`:""}
      </div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
      <div class="meta">${esc(it.repo||"fleet")} · added by ${who(it.added_by)} · touched ${ago(it.updated)} ago${
        held&&held.note?` · “${esc(held.note)}”`:""}</div>
    </div>
    <div class="acts">
      <button data-move="up" data-id="${it.item_id}" title="move up">▲</button>
      <button data-move="down" data-id="${it.item_id}" title="move down">▼</button>
      <button data-state="${it.state==="dropped"?"open":"dropped"}" data-id="${it.item_id}"
        title="${it.state==="dropped"?"put it back":"drop it"}">${it.state==="dropped"?"↩":"✕"}</button>
    </div>`;
  return el;
}

function render(){
  listEl.innerHTML = "";
  const shown = items.filter(inScope);
  for(const it of shown) listEl.appendChild(row(it));
  const n = items.find(it => it.state==="open" && !it.claim && !(it.blocked_by||[]).length && inScope(it));
  nextEl.innerHTML = n
    ? `<div class="next"><div class="lbl">next</div><div>${
        refUrl(n)?`<a href="${esc(refUrl(n))}" target="_blank" rel="noopener">${esc(refLabel(n))}</a> `:""
      }${esc(n.title)}</div>${n.note?`<div class="note">${esc(n.note)}</div>`:""}</div>`
    : (shown.length ? `<div class="next" style="border-color:#5c4a1e"><div class="lbl" style="color:#f0b429">next</div>
        <div>nothing is free — everything open is claimed or waiting</div></div>` : "");
  emptyEl.style.display = shown.length ? "none" : "block";
}

async function load(){
  const s = scope();
  const p = new URLSearchParams();
  if(s) p.set("repo", s);
  if(showDone.checked) p.set("include_done", "true");
  const r = await fetch("/plan?"+p, {headers:{Accept:"application/json"}});
  if(!r.ok){ say("plan unavailable ("+r.status+")"); return; }
  const data = await r.json();
  items = data.items;
  for(const it of items) repos.add(it.repo || "(fleet)");
  buildRepoOptions();
  const c = data.counts;
  countsEl.textContent = `${c.open} open · ${c.claimed} held · ${c.blocked} waiting · ${c.stale} stale`;
  say("");
  render();
}

function buildRepoOptions(){
  const want = ["(all)", ...[...repos].sort()];
  if(want.join("|") === [...repoSel.options].map(o=>o.value).join("|")) return;
  const keep = repoSel.value;
  repoSel.innerHTML = want.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  repoSel.value = want.includes(keep) ? keep : "(all)";
}

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                              body: JSON.stringify(body)});
  if(!r.ok){
    const d = await r.json().catch(()=>({}));
    say(typeof d.detail === "string" ? d.detail : (d.detail?.error || ("failed: "+r.status)));
    return null;
  }
  say("");
  return r.json();
}

listEl.addEventListener("click", async (e)=>{
  const move = e.target.closest("button[data-move]");
  const state = e.target.closest("button[data-state]");
  if(state){
    await post("/plan/item/update", {item_id: state.dataset.id, state: state.dataset.state});
    return load();
  }
  if(!move) return;
  // Reorder is a whole-scope rewrite: an item's rank is only meaningful beside
  // its neighbours', so the page sends the order it is showing rather than a delta.
  const s = scope();
  if(s === undefined){ say("pick a repo (or the fleet list) before reordering — order is per scope"); return; }
  const ids = items.filter(it => it.repo === s && it.state !== "done").map(it => it.item_id);
  const i = ids.indexOf(move.dataset.id);
  const j = move.dataset.move === "up" ? i-1 : i+1;
  if(i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await post("/plan/reorder", {repo: s, order: ids});
  load();
});

repoSel.onchange = load;
showDone.onchange = load;
load();
setInterval(load, 20000);
</script>
</body>
</html>
