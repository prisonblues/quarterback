<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>quarterback plan</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#6ea8fe; --chip:#232936;
    /* One safe-area token per edge, the same set fleet.html defines. A phone in
       landscape has the notch on the SIDE, which is the case a page that pads
       only the bottom loses text off the left of. */
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .spacer { flex:1; }
  header a { font-size:13px; text-decoration:none; }
  /* 16px, not 12: below 16 Safari zooms the viewport when a control takes focus,
     and the scope picker is the control this page now tells people to go and use.
     44px is the floor below which a control is missed rather than pressed. */
  select, input { background:var(--chip); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; font:inherit; font-size:16px; }
  select { min-height:44px; max-width:60vw; }
  /* 44px of tappable height on the toggle, without 44px of visible chrome */
  .toggle { display:flex; align-items:center; gap:6px; min-height:44px;
    color:var(--muted); font-size:13px; cursor:pointer; }
  .toggle input { width:20px; height:20px; accent-color:var(--accent); }
  a { color:var(--accent); }
  main { max-width:940px; margin:0 auto;
    padding:12px calc(16px + var(--sar)) calc(60px + var(--sab)) calc(16px + var(--sal)); }
  .empty { color:var(--muted); text-align:center; padding:40px 12px; }
  .counts { color:var(--muted); font-size:12px; width:100%; margin-top:-2px; }
  .next { border:1px solid #2f6f52; background:#141d19; border-radius:10px;
    padding:10px 12px; margin:10px 0 16px; }
  .next .lbl { color:#35c48a; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .next .caveat { color:#f0b429; font-size:12px; margin-top:5px; }

  /* Who is looking, and therefore whether the three verbs on this page will work
     at all — fleet.html's banner, in its colours, saying the same kind of thing.
     A refusal a reader can see coming is not the same event as a dead button. */
  .banner { border:1px solid #5c4a1e; background:#1c1810; border-radius:10px;
    padding:10px 12px; margin:8px 0 12px; color:#f0b429; font-size:13px;
    white-space:pre-wrap; word-break:break-word; }
  /* The scope gate is a STATE, not a warning: fleet.html's settled-caveat tone,
     because "you have not picked a list yet" is not something going wrong. */
  .hint { border:1px solid #31435c; background:#141821; border-radius:10px;
    padding:10px 12px; margin:8px 0 12px; color:#9fb4d0; font-size:13px;
    word-break:break-word; }

  /* `flex-wrap` is what lets the action bar (#388) take a line of its own under the
     row rather than being squeezed in beside a rank, a ref, a title and the chips. */
  .item { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:9px 12px; margin:8px 0; display:flex; gap:10px; align-items:flex-start;
    flex-wrap:wrap; }
  .item.claimed { border-color:#3a4658; }
  .item.blocked { opacity:.72; }
  .item.done, .item.dropped { opacity:.5; }
  /* A rank somebody CHOSE, against one that was merely appended (#183). The
     provenance used to live in a `title`, which on a phone is nowhere: the
     weight carries it at a glance and the tap carries the sentence. */
  .rank { color:var(--muted); font-size:12px; min-width:2.4em; text-align:right;
    padding-top:1px; min-height:44px; }
  .rank.chosen { color:var(--fg); font-weight:600; }
  /* Neither of the two answers — see rankClass(). fleet.html's `unclear` colour. */
  .rank.unclear { color:#f0b429; }
  .body { flex:1; min-width:0; }
  .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .title { font-weight:600; }
  .note { color:#aeb6c2; font-size:12px; margin-top:3px; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:11px; margin-top:3px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--chip);
    border:1px solid var(--line); color:var(--muted); }
  .chip.hold { color:#9fddc7; border-color:#2e5c48; }
  .chip.block { color:#f0b429; border-color:#5c4a1e; }
  .chip.stale { color:#e5484d; border-color:#5c2626; }
  .chip.plan { color:#c9b6f5; border-color:#3a2f56; }
  .chip.covered { color:#e0c890; border-color:#4a3b1e; }
  .chip.fleet { color:#8fb4e8; border-color:#31435c; }
  .chip.project { color:#d9a5c8; border-color:#5c3149; }
  .chip.exempt { color:#9fddc7; border-color:#2e5c48; }
  /* An ASK, not an exemption — amber, like the other "somebody is waiting" chips. */
  .chip.asked { color:#f0b429; border-color:#5c4a1e; }
  .refless { color:var(--muted); }
  .acts { display:flex; gap:4px; }
  .acts button { font:inherit; font-size:11px; cursor:pointer; background:#222831;
    color:#9fddc7; border:1px solid #2e3742; border-radius:5px; padding:1px 7px; }
  /* Dead, and still worth pressing: a `.dead` button is not `disabled`, so a tap
     reaches the page and is answered in the header rather than swallowed. */
  .acts button.dead { opacity:.4; cursor:help; }
  .acts button:disabled { opacity:.35; cursor:default; }
  /* The row's ONE permanent control (#388), and both halves of the gesture: drag it
     to move the row, tap it for the controls. `touch-action:none` is the whole of
     why a drag from here is not read as a scroll of the list — without it the
     browser claims the move before any script sees it, which is the failure that
     looks perfect on a desktop and does nothing at all on a phone. A dead grip
     hands the gesture back, because a row that cannot be dragged should still
     scroll under the thumb. */
  .acts .grip { width:44px; min-height:44px; padding:0; font-size:16px; line-height:1;
    color:var(--muted); background:#1c222b; border-color:#2e3742;
    cursor:grab; touch-action:none; }
  .acts .grip.open { color:var(--fg); border-color:var(--accent); }
  .acts .grip.dead { opacity:.4; cursor:help; touch-action:auto; }
  /* Being dragged, about to be dragged, and the thing under the finger. */
  .item.sortable-ghost { opacity:.35; border-style:dashed; }
  .item.sortable-chosen { border-color:var(--accent); }
  .item.sortable-fallback { opacity:.9; }
  /* The controls the row has no room for, on their own full-width line and only for
     the row that asked for them. Eight controls at 44px do not fit beside a title on
     a 320px screen, and 44px is the floor below which a control is missed rather
     than pressed — so they wrap onto a second line instead of shrinking. */
  .bar { display:none; }
  .bar.open { display:flex; flex-basis:100%; flex-wrap:wrap; gap:6px;
    margin-top:2px; padding-top:8px; border-top:1px solid var(--line); }
  /* `touch-action:manipulation` is load-bearing and was found the hard way: the page
     is zoomable (deliberately — `user-scalable=no` is an accessibility failure), so a
     second tap inside the double-tap window is a ZOOM gesture, and the browser holds
     the click back to find out. Tapping ▼ twice quickly moved the row one place and
     sent one request, because the second click never arrived. These are the controls
     a person taps repeatedly; this is the property that lets them. */
  .bar button { font:inherit; font-size:15px; line-height:1; cursor:pointer;
    min-width:44px; min-height:44px; padding:0 6px; touch-action:manipulation;
    background:#222831; color:#9fddc7; border:1px solid #2e3742; border-radius:6px; }
  .bar button.dead { opacity:.4; cursor:help; }
  /* Three to a line at every width this page is read at, rather than six that fit
     on one at 430px and split five-and-one at 320px — where the ⏬ that wrapped
     ends up beside the ✕ instead of beside the ▼ it belongs with. Three also
     reads as what it is: a row of ups above a row of downs, with the two biggest
     moves at opposite corners. */
  .bar button[data-move] { flex:1 1 30%; max-width:160px; }
  /* The two that are not a move do not stretch to fill the line they wrapped onto:
     a full-width ✕ is a very large target for the row's one destructive verb. */
  .bar button:not([data-move]) { flex:0 0 auto; min-width:64px; }
  /* The one destructive verb on the bar does not look like the five that only
     change a number. */
  .bar button.drop { color:#e8a0a3; border-color:#4a2b2d; }
  /* Anything carrying its own reason. `title` alone is a desktop-only answer —
     these all answer a tap too, in #note, which is inside the sticky header and
     so is on screen wherever in the list the tap happened. */
  [data-why] { cursor:help; }
  .rank[data-why] { text-decoration:underline dotted var(--line); text-underline-offset:2px; }
  header button { font:inherit; font-size:13px; cursor:pointer; background:var(--chip);
    color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px;
    min-height:44px; }
  #err { color:#e5484d; font-size:12px; width:100%; }
  #note { color:#9fb4d0; font-size:12px; width:100%; word-break:break-word; }
  /* Both take a whole line so a long sentence is not squeezed between two
     controls — which means an EMPTY one takes a whole line too, and this header is
     sticky: two blank rows would cost 40px of every screen for the rest of time. */
  #err:empty, #note:empty { display:none; }
</style>
</head>
<body>
<header>
  <h1>plan</h1>
  <select id="repo"></select>
  <button id="newScope" title="declare a scope with no repo behind it — house work, admin, anything with no forge">+ scope</button>
  <label class="toggle"><input type="checkbox" id="showDone" /> show done</label>
  <span class="spacer"></span>
  <a href="/fleet">fleet</a>
  <a href="/">board</a>
  <span id="counts" class="counts"></span>
  <!-- A failure and an explanation are different things and get different lines.
       Both live in the STICKY header: a tap thirty rows down has to be answered
       somewhere the thumb can still see. -->
  <span id="err"></span>
  <span id="note"></span>
</header>
<main>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="next"></div>
  <div id="list"></div>
  <div id="empty" class="empty">nothing in the plan yet</div>
</main>

<!-- The one script this page loads from anywhere but itself. Vendored, pinned and
     served by app/api/board_view.py; app/static/vendor/README.md says which build
     and why it is a route rather than 45KB inlined into this file. Ordinary (not
     `defer`), so `Sortable` is defined by the time the script below runs. -->
<script src="/vendor/sortable.min.js"></script>
<script>
// The plan is ordered by a HUMAN — this page is the place that happens, which is
// why it can reorder and an agent's API token cannot (see app.auth.human).
const listEl = document.getElementById("list");
const nextEl = document.getElementById("next");
const emptyEl = document.getElementById("empty");
const countsEl = document.getElementById("counts");
const errEl = document.getElementById("err");
const noteEl = document.getElementById("note");
const bannerEl = document.getElementById("banner");
const hintEl = document.getElementById("hint");
const repoSel = document.getElementById("repo");
const showDone = document.getElementById("showDone");

// `human/<user>` is what the edge mints for a person; every write on this page is
// behind it. See app.auth.human.
const HUMAN = "human";
// Where the scope picker's last setting is remembered, so a reader who picked a
// list once is not returned to (all) — the state where nothing moves — by every
// page load. Namespaced because the board serves several pages from one origin.
const SCOPE_KEY = "qb.plan.scope";

// Everything the last read returned, kept together: the rows in plan order, plus the
// counts and the `next` the SERVER computed over the whole scope. They travel as one
// because they have to agree — the header, the list and the next panel used to be
// worked out separately here, over a subset, and so disagreed on the same page load.
let plan = {items:[], counts:{}, next:null, order_trust:{}};
let repos = new Set(); // every scope seen, so the filter can be built from data
// The DECLARED project scopes, from the read's own `scopes`. Kept apart from the set
// above because they are known for a different reason: `repos` is inferred from the
// items present, and a scope just declared has none — built from the items alone it
// would be missing from the picker until somebody had already managed to put work in
// it, which is the one thing the picker is how you do.
let declared = [];
let gen = 0;           // read generation — a reply from a superseded read is discarded
let busy = false;      // a write is in flight — the 20s tick must not read back over it

// ---- reordering by more than one place at a time (#388) --------------------
//
// `POST /plan/reorder` takes the ORDER for one exact scope, not a move instruction.
// So drag, send-to-top, send-to-bottom and jump-5 are all the SAME server call with
// a differently computed array — no new endpoint, and moving rank 20 to rank 3 is
// one request rather than the seventeen ▲ taps and seventeen POSTs it used to be.
// The human-only gate, the exact-scope rule and the optimistic-repaint guard are
// untouched by any of it.
const JUMP = 5;            // "a down 5", in the words this was asked for. Fixed, so it is one tap.
let openRow = null;        // whose action bar is open — one at a time, and it survives the tick
let moveIds = [];          // the order render() drew, so a row knows where it sits in it
let dragging = false;      // a lift is in progress: the 20s tick must not repaint under it

// The rows this page may rewrite the order of, in the order it is showing them.
// Defined once, because a row's controls and the request they send have to agree
// about which list "position 3" is a position in.
function movable(s){
  return s === undefined ? []
    : plan.items.filter(it => it.repo === s && it.state === "open").map(it => it.item_id);
}

// Where a row ends up, clamped and never wrapped: "down 5" on the third-from-last
// row goes to the bottom, it does not reappear at the top. Returns null when the
// move is a no-op — there is nothing to send, and sending it would stamp `ordered`
// on a sequence nobody chose to change.
function moved(ids, from, how){
  const last = ids.length - 1;
  const to = how==="top" ? 0 : how==="bottom" ? last
    : how==="up" ? from - 1 : how==="down" ? from + 1
    : how==="up5" ? from - JUMP : how==="down5" ? from + JUMP : from;
  const at = Math.max(0, Math.min(last, to));
  if(at === from) return null;
  const out = ids.slice();
  out.splice(at, 0, out.splice(from, 1)[0]);
  return out;
}

// Safe in an ATTRIBUTE as well as in text: textContent→innerHTML escapes & < >
// and leaves quotes alone, and every value here (repo, ref, title, note) is
// agent-supplied — so a title carrying a double quote would otherwise break out
// of the href it is interpolated into.
function esc(s){ const d=document.createElement("div"); d.textContent=s??"";
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
// machine/name for an agent; human/<user> for a person, who gets a colour of
// their own and the weight on the name — the plan is a human's sequence, so
// "who edited this" needs to say at a glance whether it was a person.
function who(name){ const i=(name??"").indexOf("/");
  if(i<0) return esc(name);
  const machine = name.slice(0,i), rest = name.slice(i+1);
  if(machine==="human") return `<span style="color:#e8c07d;font-weight:600" title="a person, authenticated at the edge"><span style="color:var(--muted);font-weight:400">${esc(machine)}/</span>${esc(rest)}</span>`;
  return `${esc(machine)}<span style="color:#a9b4c6">/${esc(rest)}</span>`; }
function span(s){ if(s<60)return Math.floor(s)+"s"; if(s<3600)return Math.floor(s/60)+"m";
  if(s<86400)return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
function ago(iso){ return span(Math.max(0,(Date.now()-Date.parse(iso))/1000)); }
// A claim's expiry is in the FUTURE — running it through `ago` clamps it to
// zero and every live claim reads "expires 0s", which is precisely the claim
// that has lapsed.
function until(iso){ const s=(Date.parse(iso)-Date.now())/1000;
  return s<=0 ? "lapsed" : "in "+span(s); }
// A scope is a name for a body of work; a repo scope names a GitHub repository as
// well, and that binding is the only thing that makes a github.com URL constructible
// (#323). `project:65lowther` carries no repository, so it is never interpolated into
// one — the server refuses to attach an issue or PR ref to such an item at all, and
// this is the second half of that rule, where the URL would be built.
const PROJECT_SIGIL = "project:";
function isProject(s){ return typeof s === "string" && s.toLowerCase().startsWith(PROJECT_SIGIL); }
// What a scope is CALLED. The sigil is load-bearing on the wire and noise on screen.
function scopeLabel(s){ return s===null||s===undefined ? "fleet"
  : isProject(s) ? s.slice(PROJECT_SIGIL.length) : s; }
// What the PICKER calls it, which is not always what the scope is called: an
// instruction to go and choose something has to name the thing on screen.
function optionLabel(s){ return s===null ? "(fleet)" : scopeLabel(s); }
function refUrl(it){ return (it.repo && !isProject(it.repo) && it.ref && it.ref.kind)
  ? `https://github.com/${it.repo}/${it.ref.kind==="pr"?"pull":"issues"}/${it.ref.value}` : null; }
function refLabel(it){ return it.ref ? (it.ref.kind==="pr"?"PR #":"#")+it.ref.value : null; }
function say(msg){ errEl.textContent = msg||""; }
// An EXPLANATION, not a failure — a separate line and a separate colour, because
// "this row is ordered in another list" and "the write was refused" are two of the
// three states this page has to keep apart. Cleared by anything that changes what
// is on screen; never by the 20s tick, which would wipe an answer half a second
// after the tap that asked for it.
function note(msg){ noteEl.textContent = msg||""; }
// A FastAPI detail is a string for an HTTPException, {error,hint} for the plan
// endpoints, and a list for a pydantic validation error — so nothing may assume
// the shape. Shared by the write path and by `loadMe`, which read it two ways.
function detailText(payload){
  const det = payload && payload.detail;
  if(typeof det === "string") return det;
  if(det && typeof det === "object" && !Array.isArray(det) && det.error)
    return det.error + (det.hint ? " — " + det.hint : "");
  return det ? JSON.stringify(det) : null;
}

// An item whose scope names no repository has no GitHub URL to build from its ref —
// show the ref it does carry, and say why it is not a link, rather than dropping it.
function refHtml(it){
  if(!it.ref) return "";
  const url = refUrl(it), lbl = esc(refLabel(it));
  const why = it.repo ? "a project scope — no repo behind it to link the ref to"
                      : "fleet-wide item — it names no repo to link the ref to";
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${lbl}</a>`
             : `<span class="refless" data-why="${esc(why)}" title="${esc(why)}">${lbl}</span>`;
}

// The scope being reordered is EXACT — fleet items are their own list, so a
// reorder of "prisonblues/quarterback" can never renumber them by accident.
// "" is the value of the select before the first read has built its options — it means
// (all), not a repo named "", which is what an unguarded read would ask the server for.
function scope(){ const v = repoSel.value;
  return v==="(fleet)" ? null : (!v || v==="(all)") ? undefined : v; }

// Who decided this row sits here. A number with no provenance is what let ranks
// 1-17 (a real sequence) and 18-28 (the order the adds arrived in) look identical
// on this page — #183.
const RANK_WHY = {
  appended: "nobody chose this position — it was appended, which is all POST /plan/item could do",
  submitted: "the submitter chose the order within its plan; where that plan sits is still an append",
  placed: "placed by the agent that added it, relative to a named neighbour",
  ordered: "ordered by a human, here",
  // Quoted because of the hyphen, and hyphenated because it names a past EVENT
  // rather than a present state: the row outlives the claim that made it, so a
  // lapsed pickup still reads truthfully as "somebody picked this up".
  "picked-up": "an agent claimed the work, so the board put it on top — in flight, not ranked above what is below it",
};
// A source this page has no sentence for is an UNKNOWN, and an unknown may not be
// rendered as one of the answers. Left to `|| ""` it came out as no explanation at
// all — on a row still drawn in the muted weight that means "nobody chose this",
// which is a definite claim about the one row the page cannot make one about. The
// board's own vocabulary is a CHECK constraint today, so this is reachable only by
// a page older or newer than the board it is talking to; that is exactly when a
// silent wrong answer is worst, because nothing on either side is broken.
function rankWhy(it){
  const known = RANK_WHY[it.rank_source];
  const why = known || `the board called this position “${it.rank_source ?? "nothing at all"}”`
    + `, which this page has no sentence for — so whether anybody chose it is not `
    + `something it can tell you`;
  // Only ever appended to a sentence there is one of: "— for X" alone says nothing.
  return (known && it.placed_for) ? `${why} — for ${it.placed_for}` : why;
}
// The half of the provenance that has to be legible WITHOUT reading the sentence:
// did anybody choose this position, or is it just where the row landed? That is
// the whole distinction #183 exists to draw, and a `title` draws it for a mouse
// only. Weight, not colour alone, so it survives a reader who cannot see the
// colour and a phone screen in daylight.
//
// Three-valued, for the reason fleet.html's verdict is: `chosen` and `appended`
// are things the board REPORTED, and `unclear` is the shape of an answer it gave
// that this page cannot read. Neither of the first two, and not hidden.
// Everything the board can send EXCEPT `appended`, and that is the rule rather
// than a list that happens to agree: `_order_trust` counts a position as unchosen
// if and only if its source is `appended`, so a row drawn in the muted "nobody
// chose this" weight while the board reports the plan as trusted is the two
// halves contradicting each other in front of the reader, with neither broken.
//
// `submitted` was missing here from the start and is not part of #427 — a batch's
// items after the first were drawn as unchosen while the server counted them as
// chosen. The model settles it: "each submission leaves exactly one position
// nobody chose", which is the batch's FIRST item, and that one is `appended`.
// The rest had their order picked by the submitter.
const RANK_CHOSEN = new Set(["ordered", "placed", "picked-up", "submitted"]);
function rankClass(it){
  if(!(it.rank_source in RANK_WHY)) return " unclear";
  return RANK_CHOSEN.has(it.rank_source) ? " chosen" : "";
}

// A control that will not act, without `disabled`. The gate is the same one it
// always was — the difference is that the browser still delivers the tap, so the
// button can say why instead of only looking like it might be broken. Announced
// to assistive tech as unavailable (`aria-disabled`), which `disabled` would do
// at the cost of the explanation, since a disabled control takes no events and
// no focus.
function dead(ok, why){
  return ok ? "" : `class="dead" aria-disabled="true" data-why="${esc(why)}"`;
}

// The other half of the same idea, which #387 did not need because ▲▼ were the only
// controls and the only thing they ever had to say was why they would not act. A bar
// of eight glyphs has to answer "what does this one do?" too, and a thumb has no way
// to ask but a tap. `dead()` is called verbatim for the refusal, so the vocabulary
// still has exactly one definition.
function ctl(ok, refusal, does){
  return ok ? `data-why="${esc(does)}" title="${esc(does)}"`
            : `${dead(false, refusal)} title="${esc(refusal)}"`;
}

// What the server says the note means about review — never re-derived here. The
// marker is a token in free text, and a second regex on this page is how the page
// and the queue would come to disagree about the same row.
function rv(it){ return it.review || {}; }

function row(it, s){
  const el = document.createElement("div");
  const held = it.claim, blocked = (it.blocked_by||[]).length;
  // Only an OPEN row of the exact scope on screen has an order this page can rewrite:
  // the server orders open items alone, and per exact scope — so a done row, a fleet
  // row riding along in a repo read, or anything in the mixed (all) list would be
  // refused. The buttons say that by being dead, instead of accepting the click and
  // quietly doing nothing with it.
  const canMove = it.state==="open" && s!==undefined && it.repo===s;
  // The class the drag reads, and it is the SAME gate: a row the ▲▼ refuse to move
  // is a row a drag refuses to pick up, and — just as important — a row nobody
  // else's drag can displace, which is what keeps the order read back off the DOM
  // honest. `data-id` is how that read names the rows.
  el.className = "item " + it.state + (held?" claimed":"") + (blocked?" blocked":"")
    + (canMove?" movable":"");
  el.dataset.id = it.item_id;
  // The gate is unchanged — what changed is that its reason is reachable without a
  // hover. Every branch names the list the row IS ordered in, because "not here"
  // and "nowhere" are different answers and only one of them is worth acting on.
  const why = canMove ? null
    : it.state!=="open" ? `a ${it.state} row carries no order — only open items are ranked`
    : s===undefined ? "order is per scope, and (all) is several of them at once — "
                    + "pick one in the picker above"
    : `this row is ordered in ${scopeLabel(it.repo)}, not in ${scopeLabel(s)} — `
      + `pick ${optionLabel(it.repo)} in the picker above to move it`;
  // Said on the row as well as on the tap, for the one case a reader cannot infer
  // from anything already on screen: an OPEN row riding along from another list,
  // sitting among rows that do move. A done row is faded and chipped `done`, and
  // in (all) the reason is the same for every row and is stated once, above.
  const elsewhere = it.state==="open" && s!==undefined && it.repo!==s;
  // A done row exists FOR its completion record, so dropping it would destroy the one
  // thing it is there to hold (the server refuses too). Present-but-dead, because a
  // missing button reads as a bug rather than as "not applicable here".
  const dropTo = it.state==="done" ? null : (it.state==="dropped" ? "open" : "dropped");
  const dropWhy = dropTo==="open" ? "put it back"
    : dropTo ? "drop it" : "done stays done — its completion record is the point";
  // Exempting a PR from review is a HUMAN write, on the same footing as reordering
  // (#335, and app.auth.human for the reasoning). It is on this page because this
  // page is where a person is: an agent that could exempt its own PR would be
  // authorising the skipping of the check that is on it — the self-approval
  // argument #85, #86 and #78 each settled, one level further out. Agents ASK, at
  // POST /plan/item/exempt, and the ask shows up on the row as an amber chip.
  const canExempt = it.state==="open" && it.ref && it.ref.kind==="pr";
  // #398's ⊘ and its two review chips arrived hover-only — written before this
  // mechanism existed, and they are exactly the defect this PR is about. Each
  // explanation is hoisted to a sentence and carried by `data-why` as well as
  // `title`, the same as the rank and the refless ref above. A request that named
  // no reason still has to answer the tap: "nothing was said" is an answer, and an
  // empty tooltip is the silence #398 spent its own last commit removing.
  const grantWhy = rv(it).granted_by ? `granted by ${rv(it).granted_by}`
    : "the note carries the marker";
  const askedWhy = rv(it).requested_reason || "no reason was given with the request";
  const exemptWhy = !canExempt ? ""
    : rv(it).exempt ? "put this PR back in the review queue"
    : rv(it).requested ? `${rv(it).requested_by||"somebody"} asked: ${askedWhy}`
    : "take this PR out of the review queue";
  // Where this row sits in the list the page may rewrite — the only list in which a
  // position means anything. A control that would not change that position is dead
  // for that reason rather than accepted and quietly dropped, which is the same
  // rule the scope gate follows one line up.
  const at = canMove ? moveIds.indexOf(it.item_id) : -1;
  const upOk = canMove && at > 0, downOk = canMove && at >= 0 && at < moveIds.length - 1;
  const upWhy = canMove ? `it is already first in ${scopeLabel(s)} — nothing is above it` : why;
  const downWhy = canMove ? `it is already last in ${scopeLabel(s)} — nothing is below it` : why;
  const open = it.item_id === openRow;
  // The grip carries the refusal but is never `aria-disabled`, and the difference is
  // not a technicality. `dead()`'s vocabulary is for a control that WILL NOT ACT;
  // this one always acts — even a row whose order this page may not touch is a row a
  // person may drop, and the drop button lives on the bar the grip opens. Announcing
  // it as unavailable would hide the only route to that button from the readers most
  // likely to need it. It is dimmed, it is not liftable, and its accessible name is
  // the sentence saying so.
  const gripWhy = !canMove ? why
    : DRAG_OK ? "drag it to move it — or tap for the controls"
    : "tap for the controls — the drag library did not load, so dragging is off";
  el.innerHTML = `
    <div class="rank${rankClass(it)}" data-why="${esc(rankWhy(it))}"
      title="${esc(rankWhy(it))}">${it.state==="open"?it.rank:"·"}</div>
    <div class="body">
      <div class="row1">
        ${refHtml(it)}
        <span class="title">${esc(it.title)}</span>
        ${it.repo===null&&s!==null?`<span class="chip fleet">fleet</span>`:""}
        ${isProject(it.repo)&&it.repo!==s?`<span class="chip project">project</span>`:""}
        ${it.plan?`<span class="chip plan">${esc(it.plan.label)}</span>`:""}
        ${held?`<span class="chip hold">held by ${who(held.holder)} · expires ${until(held.expires)}</span>`:""}
        ${!held&&it.covered_by?`<span class="chip covered">in ${esc((it.plan&&it.plan.label)||"a plan")} held by ${who(it.covered_by.holder)}</span>`:""}
        ${blocked?`<span class="chip block">waiting on ${it.blocked_by.map(b=>esc(b.ref?("#"+b.ref):b.title)).join(", ")}</span>`:""}
        ${rv(it).exempt?`<span class="chip exempt" data-why="${esc(grantWhy)}"
          title="${esc(grantWhy)}">review exempt</span>`:""}
        ${!rv(it).exempt&&rv(it).requested?`<span class="chip asked" data-why="${
          esc(askedWhy)}" title="${esc(askedWhy)}">exemption asked for by ${
          rv(it).requested_by?who(rv(it).requested_by):"somebody"}</span>`:""}
        ${it.stale?`<span class="chip stale">stale ${it.idle_days}d</span>`:""}
        ${it.state!=="open"?`<span class="chip">${esc(it.state)}</span>`:""}
      </div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
      <div class="meta">${esc(scopeLabel(it.repo))}${
        elsewhere?" · ordered there, not here":""} · added by ${who(it.added_by)} · touched ${ago(it.updated)} ago${
        held&&held.note?` · “${esc(held.note)}”`:""}${
        !held&&it.covered_by&&it.covered_by.note?` · “${esc(it.covered_by.note)}”`:""}</div>
    </div>
    <div class="acts">
      <button class="grip${open?" open":""}${canMove?"":" dead"}" data-grip
        data-id="${esc(it.item_id)}" aria-expanded="${open?"true":"false"}"
        aria-controls="bar-${esc(it.item_id)}"
        aria-label="${esc(gripWhy)}" data-why="${esc(gripWhy)}"
        title="${esc(gripWhy)}">☰</button>
    </div>
    <div class="bar${open?" open":""}" id="bar-${esc(it.item_id)}" role="group"
      aria-label="controls for ${esc(it.title)}">${open?`
      <button data-move="top" data-id="${esc(it.item_id)}"
        ${ctl(upOk, upWhy, `send it to the top of ${scopeLabel(s)}`)}>⏫</button>
      <button data-move="up5" data-id="${esc(it.item_id)}"
        ${ctl(upOk, upWhy, `move it up ${JUMP} places — or to the top, whichever comes first`)}>▲${JUMP}</button>
      <button data-move="up" data-id="${esc(it.item_id)}"
        ${ctl(upOk, upWhy, "move it up one place")}>▲</button>
      <button data-move="down" data-id="${esc(it.item_id)}"
        ${ctl(downOk, downWhy, "move it down one place")}>▼</button>
      <button data-move="down5" data-id="${esc(it.item_id)}"
        ${ctl(downOk, downWhy, `move it down ${JUMP} places — or to the bottom, whichever comes first`)}>▼${JUMP}</button>
      <button data-move="bottom" data-id="${esc(it.item_id)}"
        ${ctl(downOk, downWhy, `send it to the bottom of ${scopeLabel(s)}`)}>⏬</button>
      ${canExempt?`<button data-exempt="${rv(it).exempt?"false":"true"}"
        data-id="${esc(it.item_id)}" data-why="${esc(exemptWhy)}"
        title="${esc(exemptWhy)}">⊘</button>`:""}
      <button data-id="${esc(it.item_id)}" ${dropTo?`class="drop" data-state="${dropTo}"
        data-why="${esc(dropWhy)}"`:dead(false, dropWhy)}
        title="${esc(dropWhy)}">${it.state==="dropped"?"↩":"✕"}</button>`:""}
    </div>`;
  return el;
}

// The one invariant: the counts, the list and the next panel always describe the same
// set of rows — so all three come from the same read, and none of them is worked out
// here. Every scope this page offers is a scope the server can be asked for directly:
// (all) is an unscoped read, a repo is `?repo=` (which brings the fleet band with it,
// by design), and (fleet) is `?exact=true` with no repo. Narrowing a wider read here
// instead is what made the header describe one set and the list another — and, once
// the fleet band sorts last, would have let `limit` cut off the very rows it kept.
function render(){
  const s = scope();
  const shown = plan.items, counts = plan.counts || {}, next = plan.next;
  // Worked out once per paint, and read by every row: a control that sends the row
  // to the top has to mean the same list the request will name.
  moveIds = movable(s);
  // An open bar belongs to a row. Change the scope, or drop the row, and the row is
  // gone — a bar left open would reattach itself to whatever id happened to match.
  if(openRow && !shown.some(it => it.item_id === openRow)) openRow = null;

  // Said ONCE, above the list, rather than forty times inside it: in (all) every
  // row is dead for the same reason, and that reason is the page's default state.
  // A per-row repeat of one fact is the noise the tooltip was avoiding; a line
  // that is simply on the page costs nothing to read and nothing to reach.
  hintEl.innerHTML = s===undefined
    ? `<div class="hint">nothing here can be reordered yet — <b>(all)</b> is several
        lists at once, and an order only means something inside one. Pick a scope in
        the picker above (or <b>(fleet)</b>) and the ▲▼ on its rows go live.</div>`
    : "";
  listEl.innerHTML = "";
  for(const it of shown) listEl.appendChild(row(it, s));
  // `covered` is in the header for the same reason it is in `counts` at all: an item
  // inside a plan somebody ELSE holds is why `next` skipped it, and a header that
  // named only claims and blockers said "2 open · 0 held · 0 waiting" directly above
  // a panel saying everything open was claimed or waiting. Held item-by-item and held
  // by the plan over it are two different things to go and ask about, so they are two
  // counts — and the per-row chip explains one row, not the two places a reader looks
  // first.
  countsEl.textContent = `${counts.open||0} open · ${counts.claimed||0} held · ` +
    `${counts.covered||0} in a held plan · ${counts.blocked||0} waiting · ` +
    `${counts.stale||0} stale`;
  // `next` walks rank order, so it is exactly as good as the ranks are. The page
  // says so in the same panel rather than somewhere a reader has to go looking:
  // this is the surface where the answer is fixed, one drag at a time.
  const ord = plan.order_trust || {};
  const caveat = (next && next.caveat) ? next.caveat
    : (!next && ord.trusted === false && ord.hint) ? ord.hint : null;
  nextEl.innerHTML = next
    ? `<div class="next"><div class="lbl">next</div><div>${refHtml(next)} ${
        esc(next.title)}</div>${next.note?`<div class="note">${esc(next.note)}</div>`:""}${
        caveat?`<div class="caveat">⚠ ${esc(caveat)}</div>`:""}</div>`
    // Keyed off the same counts as the header: "everything open is spoken for" is only
    // true if something is open at all — a page of history alone gets no panel. And it
    // names all three reasons `next` skips an item, because a reader whose whole plan
    // is covered by one claim would otherwise be told it is "claimed or waiting" with
    // nothing on the page claimed and nothing waiting.
    : (counts.open ? `<div class="next" style="border-color:#5c4a1e"><div class="lbl" style="color:#f0b429">next</div>
        <div>nothing is free — everything open is claimed, waiting, or inside a plan somebody else holds</div></div>` : "");
  // Naming the scope matters now the picker remembers one: an empty list under a
  // filter a previous visit set reads as an empty PLAN otherwise.
  emptyEl.textContent = s===undefined ? "nothing in the plan yet"
    : `nothing in ${scopeLabel(s)}`;
  emptyEl.style.display = shown.length ? "none" : "block";
}

async function load(){
  const s = scope(), my = ++gen;
  const p = new URLSearchParams();
  // (fleet) is `?exact=true` with no repo — the fleet list by itself. A repo read
  // deliberately widens to carry the fleet band along: those items are part of what is
  // next for anybody, and an agent that never sees them is who fleet scope is for.
  if(typeof s === "string") p.set("repo", s);
  if(s === null) p.set("exact", "true");
  if(showDone.checked) p.set("include_done", "true");
  let d;
  try {
    const r = await fetch("/plan?"+p, {headers:{Accept:"application/json"}});
    if(!r.ok){ if(my===gen) say("plan unavailable ("+r.status+")"); return; }
    d = await r.json();
  } catch(err) {
    // Without this the last good page stayed on screen, looking live, with nothing to
    // say it had stopped refreshing.
    if(my===gen) say("plan unreachable — " + ((err && err.message) || "network error"));
    return;
  }
  // A slower earlier read — the 20s tick, usually — must not repaint over a newer
  // filter change or over a list that has just been reordered.
  if(my !== gen) return;
  plan = {items: d.items || [], counts: d.counts || {}, next: d.next || null,
          order_trust: d.order_trust || {}};
  // Every read carries them, so this is current on every tick and needs no second
  // fetch — the same reason `next` and `counts` ride along with the items.
  if(Array.isArray(d.scopes)) declared = d.scopes.map(x => x.scope);
  const seen = new Set(plan.items.map(it => it.repo || "(fleet)"));
  // Only the unscoped (all) read sees every repo, so only it may REPLACE the option
  // list; a repo read returns that repo plus the fleet band, and the fleet read returns
  // the fleet alone — rebuilding from either would strand the reader in the scope they
  // just picked. Rebuilding at all matters because a repo whose items have all gone
  // should leave the dropdown, not sit in it forever.
  repos = s === undefined ? seen : new Set([...repos, ...seen]);
  if(repoSel.value && repoSel.value !== "(all)") repos.add(repoSel.value);
  buildRepoOptions();
  say("");
  render();
}

function buildRepoOptions(){
  const want = ["(all)", ...new Set([...repos, ...declared])].sort(
    (a,b) => a==="(all)" ? -1 : b==="(all)" ? 1 : a.localeCompare(b));
  if(want.join("|") === [...repoSel.options].map(o=>o.value).join("|")) return;
  const keep = repoSel.value;
  // The VALUE is the canonical scope the server is asked for; the TEXT is what the
  // scope is called. Two spellings on the wire is the defect this whole feature is
  // downstream of, so only the label is ever shortened.
  repoSel.innerHTML = want.map(v=>`<option value="${esc(v)}">${
    esc(v==="(all)"||v==="(fleet)" ? v : scopeLabel(v))}</option>`).join("");
  repoSel.value = want.includes(keep) ? keep : "(all)";
}

// Declaring a scope is a HUMAN's call, like reordering — see app.auth.human and
// app/scope.py. It is on this page because this page is where a person is: an agent
// that could mint a scope would eventually mint one by typo, and the work would be in
// a second list nobody can see both halves of.
document.getElementById("newScope").onclick = async ()=>{
  const name = (prompt("Name a scope with no repo behind it — house work, admin, "
    + "anything with no forge.\n\nLetters, digits, . - _ (e.g. 65lowther)") || "").trim();
  if(!name) return;
  // NOT `note` — that is the function that puts an explanation in the header, and a
  // local of the same name shadows it for this whole handler, TDZ included.
  const blurb = (prompt(`What is “${name}”? One line, for whoever reads the plan next.`) || "").trim();
  busy = true;
  let made;
  try { made = await post("/plan/scope", {name, note: blurb || null}); } finally { busy = false; }
  if(!made) return;
  note("");
  say(made.created ? `declared ${made.scope}` : `${made.scope} was already declared`);
  declared = [...new Set([...declared, made.scope])];
  buildRepoOptions();
  repoSel.value = made.scope;
  rememberScope(made.scope);
  load();
};

async function post(path, body){
  let r;
  try {
    r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                           body: JSON.stringify(body)});
  } catch(err) {
    say("could not reach the server — " + ((err && err.message) || "network error"));
    return null;
  }
  if(!r.ok){
    // A 403 from `app.auth.human` arrives here as a sentence naming the boundary,
    // and it is shown verbatim: "the edge refused this write" is one of the three
    // states this page has to be able to tell apart, and the server's own words
    // are the only ones that distinguish it.
    const payload = await r.json().catch(()=>null);
    say(detailText(payload) || "failed: "+r.status);
    return null;
  }
  say("");
  // Never null on success: the caller reads null as "it failed, keep the message up".
  return (await r.json().catch(()=>null)) || {};
}

listEl.addEventListener("click", async (e)=>{
  // Anything carrying its own reason answers the tap with it, in the sticky
  // header. This is FIRST because a dead move button carries `data-move` as well
  // — saying why is the whole of what it can do, and the click must not fall
  // through to a reorder the gate has already refused.
  const why = e.target.closest("[data-why]");
  note(why ? why.dataset.why : "");
  // The grip is the row's only permanent control and it writes nothing: drag it to
  // move the row, tap it for the rest. Handled before the refusal below because it
  // is answered even on a row that cannot be reordered — the drop button is on that
  // bar too, and a row whose ORDER this page may not touch is still a row a person
  // may drop.
  const grip = e.target.closest("button[data-grip]");
  if(grip){
    openRow = openRow === grip.dataset.id ? null : grip.dataset.id;
    render();
    return;
  }
  const move = e.target.closest("button[data-move]");
  const state = e.target.closest("button[data-state]");
  const exempt = e.target.closest("button[data-exempt]");
  // What stops the fall-through is the REFUSAL, and it is read off the button that
  // carries the VERB — never off whichever element happened to explain itself. Read
  // the verb first and a refused reorder runs; read the reason first and any LIVE
  // control that learns to explain itself goes quietly dead in the act of learning
  // (#398's ⊘ says what tapping it will do, and a thumb has no other way to be told).
  // Anything with a reason and no verb — the rank, the review chips, a refless ref —
  // has been answered already and falls out of the `else` below.
  const act = exempt || state || move;
  if(act && act.matches('.dead, [aria-disabled="true"]')) return;
  let path, body;
  // The one body that cannot be worked out here. A reorder is a whole SEQUENCE and
  // means something only relative to the list at the instant it is computed;
  // exempting or dropping names one row and means the same thing whenever it is
  // sent. So the reorder is deferred to `write()`, which runs it after the writes
  // ahead of it have landed and been read back — that is what makes a second tap
  // 150ms after the first a second decision, rather than the same one sent twice
  // with whichever the server saw last winning.
  let build = null;
  if(exempt){
    const grant = exempt.dataset.exempt === "true";
    // A reason in both directions, and required by the server — an exemption with
    // nothing behind it is the bare flag #279 refuses, and somebody has to be able
    // to judge it in a fortnight. The pending ask is offered as the default so
    // agreeing with an agent's reasoning is one tap and one Enter.
    const it = plan.items.find(x => x.item_id === exempt.dataset.id) || {};
    const asked = (it.review && it.review.requested_reason) || "";
    const reason = (prompt(grant
      ? "Why can this PR skip review? It stays in the record, with your name on it."
      : "Why is it going back in the queue?", grant ? asked : "") || "").trim();
    if(!reason) return;
    path = "/plan/item/exempt";
    body = {item_id: exempt.dataset.id, reason, grant};
  } else if(state){
    // Belt and braces beside the disabled button in row(): dropping a done item would
    // throw away the completion record the row exists to hold (the server 409s too).
    const it = plan.items.find(x => x.item_id === state.dataset.id);
    if(it && it.state === "done") return;
    path = "/plan/item/update";
    body = {item_id: state.dataset.id, state: state.dataset.state};
  } else if(move){
    // Reorder is a whole-scope rewrite: an item's rank is only meaningful beside its
    // neighbours', so the page sends the order it is showing rather than a delta. Only
    // OPEN items of the exact scope may be in it — anything else is a 422.
    //
    // Every button on the bar comes through here with a different array, which is why
    // "down 5" is ONE request and not five: `moved()` computes the whole sequence and
    // the endpoint takes the whole sequence.
    path = "/plan/reorder";
    build = ()=>{
      const s = scope();
      if(s === undefined){ say("pick a scope (or the fleet list) before reordering — order is per scope"); return null; }
      const ids = movable(s);
      const i = ids.indexOf(move.dataset.id);
      if(i < 0) return null;
      const order = moved(ids, i, move.dataset.move);
      return order && {repo: s, order};
    };
  } else return;
  write(path, build || (()=>body));
});

// Every write this page makes goes out on this chain: one at a time, in the order it
// was asked for, and with each body worked out only once the one before it has landed
// and been read back. Without it, two taps 150ms apart were two requests computed from
// the SAME list — the second a decision made without the first — and whichever the
// server happened to see last won, so a quick double-tap on ▼ moved a row one place.
let queue = Promise.resolve();
function write(path, build){
  const mine = queue.then(async ()=>{
    const body = build();
    if(!body) return;
    // `busy` stops the tick STARTING a read; it does nothing about one already in
    // flight, which was asked for before this write and would land afterwards and
    // paint the list as it was. Superseding it is what `gen` is for — the same
    // mechanism that already discards a read overtaken by a filter change.
    busy = true; gen++;
    let ok;
    try { ok = await post(path, body); } finally { busy = false; }
    // A refused write keeps the server's own sentence in the header — `render()`
    // does not touch it — and puts the list back where the board still has it. That
    // is what an optimistic drag needs, and what the buttons do not mind: they
    // changed nothing on screen, so repainting from `plan` changes nothing back.
    if(ok) await load(); else render();
  });
  queue = mine.catch(()=>{});
  return mine;
}

// ---- the drag ---------------------------------------------------------------
//
// SortableJS, vendored at a pinned version and served from /vendor/sortable.min.js
// (app/api/board_view.py; app/static/vendor/README.md for the pin). The reason it is
// a library and not thirty lines here: HTML5 drag-and-drop — `draggable`,
// `dragstart` — DOES NOT FIRE ON TOUCH, so the obvious implementation tests
// perfectly on the desktop it was written on and does nothing whatsoever on the
// phone this was asked for. What is left after that trap is avoided is autoscrolling
// a list taller than the screen, telling a lift from a scroll, and handling
// `pointercancel` when the OS decides the gesture was something else — which is
// exactly the set a hand-rolled version gets subtly wrong on a phone.
const DRAG_OK = typeof Sortable !== "undefined";
const sorter = DRAG_OK && Sortable.create(listEl, {
  // A dedicated grip, not the whole row. Made the whole row draggable, a lift and a
  // scroll are the same gesture and a long-press is the only way to separate them —
  // and a long-press is a delay before anything happens, on every drag, for ever.
  // With 44px of grip carrying `touch-action:none` the intent is in WHERE the finger
  // landed, so the lift can be immediate and a swipe anywhere else still scrolls.
  handle: ".grip",
  // The same gate as the buttons: `.movable` is written by row() from `canMove`, so
  // a drag refuses to pick up exactly the rows ▲▼ refuse to move. It also means a
  // row of another list riding along in this one is never displaced by a drag, which
  // is what lets the request be read straight off the DOM below.
  draggable: ".item.movable",
  // A dead grip must still deliver its tap, so the header can say why — swallowing
  // it is #387's defect exactly, in the one place the reason matters most.
  filter: ".grip.dead",
  preventOnFilter: false,
  // One code path on both. Left to itself Sortable uses native HTML5 dragging on a
  // desktop and its own pointer handling on touch, and then the thing that was
  // tested is not the thing that ships to the phone.
  forceFallback: true,
  animation: 150,
  // Sensitivity is set per drag in onStart, from the header — see there.
  scroll: true, scrollSpeed: 14,
  onStart(){
    dragging = true;
    // A read asked for before the lift must not be allowed to land during it:
    // `render()` replaces the list's innerHTML, which would destroy the row under
    // the finger. `busy`/`dragging` only stop the tick STARTING one.
    gen++;
    note("");
    // The band that triggers autoscroll has to begin BELOW the sticky header, or the
    // only way to scroll the list upward is to hold the finger where the header
    // covers the row you are aiming at. The header's height is not a constant — it
    // wraps at 320px and grows a line whenever there is something to say — so it is
    // measured now, with the note above already cleared, rather than guessed at once.
    sorter.option("scrollSensitivity", 24 +
      Math.round(document.querySelector("header").getBoundingClientRect().height));
  },
  onEnd(evt){
    dragging = false;
    eatTheClick();
    const s = scope();
    if(evt.oldIndex === evt.newIndex || s === undefined) return;
    // Read off the DOM rather than recomputed from two indices: what the reader is
    // looking at IS the request, so there is no arithmetic that can disagree with it.
    // Passed already computed, not deferred like the buttons': the drop's meaning is
    // the arrangement the reader made, not whatever the list becomes while it queues.
    const order = [...listEl.querySelectorAll(".item.movable")].map(el => el.dataset.id);
    write("/plan/reorder", ()=>({repo: s, order}));
  },
});

// The compatibility click a drag leaves behind is not a tap, and on the grip a tap
// means "open the controls" — so every drop would end by opening a bar nobody asked
// for, or by landing on whatever button the finger came up over. Swallowed at the
// capture phase, exactly once, and given up on after half a second. A flag cleared on
// a zero-delay timer would be assuming the click is dispatched before the next task,
// which is not a promise any browser makes and not one Safari keeps.
function eatTheClick(){
  let timer;
  const stop = ()=>{ document.removeEventListener("click", eat, true); clearTimeout(timer); };
  const eat = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); stop(); };
  timer = setTimeout(stop, 500);
  document.addEventListener("click", eat, true);
}

// ---- who is looking, and therefore whether any of this will be accepted -----

// Identity is a QUESTION, never an assumption — the same page is served to an
// agent's token, to a person the edge vouched for, and to a browser nobody
// vouched for. All three writes here (reorder, drop, declare a scope) are behind
// `app.auth.human`, so the page asks and says what it was told rather than
// leaving the refusal to arrive as a bare 403 under a thumb. Same banner, same
// colours and the same reasoning as fleet.html — one vocabulary for "the verb on
// this page may not be yours", not two.
async function loadMe(){
  let r;
  try { r = await fetch("/whoami", {headers:{Accept:"application/json"}}); }
  catch(err){ return; }   // offline: the list read reports the connection
  const body = await r.json().catch(()=>null);
  if(r.ok && body && body.kind === HUMAN) return;   // a person — nothing to warn about
  let msg;
  if(r.ok && body)
    // Flatly, because here it IS flat: unlike ending a session on your own machine,
    // there is no agent path into the plan's order at all. An agent that reads this
    // and tries anyway gets the same sentence back from the server.
    msg = `the board says you are looking as ${who(body.agent)} — an agent, not a `
        + `person. Ordering the plan, dropping a row and declaring a scope are a `
        + `person's calls, so all three will be refused here; a person the edge `
        + `vouches for may make them.`;
  else if(r.ok)
    msg = `the board answered /whoami with something this page could not read, so `
        + `whether a reorder will be accepted is unknown until you try it.`;
  else
    msg = `the board will not say who you are (${r.status}), so reordering, dropping `
        + `a row and declaring a scope will be refused. What it said:`
        + (detailText(body) ? "\n\n" + esc(detailText(body)) : "");
  bannerEl.innerHTML = `<div class="banner">${msg}</div>`;
}

// ---- the picker remembers -------------------------------------------------

// Every load landing in (all) is every load landing in the one state where nothing
// can be moved. A reader who has chosen a list has said which list they are working
// in; there is no reason to ask again on the next page load. Wrapped because Safari
// throws on localStorage in private browsing, and a page that cannot remember a
// filter must still render.
function rememberedScope(){
  try { return localStorage.getItem(SCOPE_KEY); } catch(err){ return null; }
}
function rememberScope(v){ try { localStorage.setItem(SCOPE_KEY, v); } catch(err){} }

// Injected BEFORE the first read, so that read is already the reader's scope
// rather than (all) followed by a second fetch. `buildRepoOptions` keeps whatever
// the picker holds, so a scope whose items have all gone still offers its way out.
const saved = rememberedScope();
if(saved && saved !== "(all)"){
  repoSel.innerHTML = `<option value="${esc(saved)}">${
    esc(saved==="(fleet)" ? saved : scopeLabel(saved))}</option>`;
  repoSel.value = saved;
}

repoSel.onchange = ()=>{ rememberScope(repoSel.value); note(""); load(); };
showDone.onchange = ()=>{ note(""); load(); };
loadMe();
load();
// The tick deliberately touches neither the note nor the banner: an explanation
// that vanished half a second after the tap that asked for it would be worse than
// the tooltip it replaces.
// A lift counts as busy for the same reason a write does: repainting the list under
// a finger mid-drag destroys the row being dragged.
setInterval(()=>{ if(!busy && !dragging) load(); }, 20000);
</script>
</body>
</html>
