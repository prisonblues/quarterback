[project]
name = "quarterback"
version = "3.23.0"  # served version lives in app/main.py — keep the two in step
description = "Cross-device agent coordination + session-sync board"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic",
    "pydantic-settings",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # For `-n auto` in the harness job, which is where the wait actually is: those
    # suites are dominated by subprocess waits — a 220-line bash suite building git
    # repos, four tests driving a real tmux server — so they overlap almost perfectly
    # across cores (#233). Deliberately NOT in `addopts` below: the flake's check
    # sandboxes hold pytest and nothing else, and a project-wide `-n` would fail every
    # one of them on an unrecognised argument. The flag lives at the call site that
    # has this installed.
    "pytest-xdist",
    "httpx",
    "ruff",
]
# The dashboard's own dependencies, kept OUT of `dev` on purpose. `qb-board
# --follow` and the tail half must import neither, and the way that claim stays
# true is that the ordinary test run does not have them installed — the same
# reasoning mcp/pyproject.toml already uses for its own `tui`. The harness job
# runs the suite both ways.
tui = [
    "textual",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Named explicitly so a bare `pytest` loads tests/conftest.py as an *initial*
# conftest — which is what lets it announce the database it is about to rebuild
# before collection starts, rather than after. It also keeps a bare run off
# harness/, which carries its own suite with its own conventions.
testpaths = ["tests"]
asyncio_mode = "auto"
# One shared event loop for the whole session so the module-level async engine's
# connection pool isn't torn down under a closed loop between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",   # line-too-long (handled by formatter)
]

# `harness/` used to be excluded wholesale (#47). It is the most-edited code in the
# repo — `panel.py` above all — and the exclusion meant the cheapest possible class
# of defect was being caught by the most expensive possible reviewer: `ci_txt ={…`,
# a missing space with the continuation left at its old indent, reached review on #34
# because no tool was looking. Two narrow ignores buy the whole directory instead.
[tool.ruff.lint.per-file-ignores]
# The `# noqa: E402` on an import that follows a `sys.path.insert` is the reason the
# exclusion existed, and it is NOT a dead directive — ruff simply tolerates the idiom
# where pycodestyle does not, so RUF100 calls 326 of them unused and stripping them
# would make the files worse under any other linter. (The exclusion's own comment said
# these fire "because this config does not enable E402"; that premise is stale — `E` is
# selected, E402 is on, and there are 4 real E402 findings in here. They are unused for
# the opposite reason: ruff does not flag what they suppress.) The remaining 73 name
# rules this config does not select at all — BLE001, PLC0415, N802, A003, S603 — and are
# suppressions for a stricter selection, not mistakes. Both kinds are worth keeping and
# neither is worth a rule; what is not worth having is the whole directory unlinted for
# them. Revisit if the harness ever becomes ruff-only.
"harness/**" = ["RUF100"]
# The panel is split across modules that re-export each other's names by design — every
# one of these files already carries `# noqa: F401,F403` on the star import itself. F405
# is the same architecture seen from the other end ("may be undefined, or from a star
# import"), 802 times, and silencing it here is consistent with the suppression that is
# already on the import. Replacing the star imports is a refactor of the most-edited
# file in the repo and is not this issue.
"harness/loops/panel*.py" = ["F405"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
