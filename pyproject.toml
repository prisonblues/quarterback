[project]
name = "quarterback"
version = "3.14.0"  # served version lives in app/main.py — keep the two in step
description = "Cross-device agent coordination + session-sync board"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic",
    "pydantic-settings",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # For `-n auto` in the harness job, which is where the wait actually is: those
    # suites are dominated by subprocess waits — a 220-line bash suite building git
    # repos, four tests driving a real tmux server — so they overlap almost perfectly
    # across cores (#233). Deliberately NOT in `addopts` below: the flake's check
    # sandboxes hold pytest and nothing else, and a project-wide `-n` would fail every
    # one of them on an unrecognised argument. The flag lives at the call site that
    # has this installed.
    "pytest-xdist",
    "httpx",
    "ruff",
]
# The dashboard's own dependencies, kept OUT of `dev` on purpose. `qb-board
# --follow` and the tail half must import neither, and the way that claim stays
# true is that the ordinary test run does not have them installed — the same
# reasoning mcp/pyproject.toml already uses for its own `tui`. The harness job
# runs the suite both ways.
tui = [
    "textual",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Named explicitly so a bare `pytest` loads tests/conftest.py as an *initial*
# conftest — which is what lets it announce the database it is about to rebuild
# before collection starts, rather than after. It also keeps a bare run off
# harness/, which carries its own suite with its own conventions.
testpaths = ["tests"]
asyncio_mode = "auto"
# One shared event loop for the whole session so the module-level async engine's
# connection pool isn't torn down under a closed loop between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
# harness/ arrived verbatim from the repo that used to own it, and lints under
# different conventions — 13 of its 32 findings here are RUF100 "unused noqa",
# fired only because this config does not enable E402. "Fixing" those would strip
# suppressions that are correct wherever E402 IS enabled, i.e. make the files
# worse to satisfy a linter they were not written against. Excluded so this stays
# a faithful move rather than a move plus 32 unrelated edits; reconciling the
# harness onto its own ruff config is tracked separately.
extend-exclude = ["harness"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",   # line-too-long (handled by formatter)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
