[project]
name = "quarterback"
version = "3.23.0"  # served version lives in app/main.py — keep the two in step
description = "Cross-device agent coordination + session-sync board"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic",
    "pydantic-settings",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # For `-n auto` in the harness job, which is where the wait actually is: those
    # suites are dominated by subprocess waits — a 220-line bash suite building git
    # repos, four tests driving a real tmux server — so they overlap almost perfectly
    # across cores (#233). Deliberately NOT in `addopts` below: the flake's check
    # sandboxes hold pytest and nothing else, and a project-wide `-n` would fail every
    # one of them on an unrecognised argument. The flag lives at the call site that
    # has this installed.
    "pytest-xdist",
    "httpx",
    "ruff",
]
# The dashboard's own dependencies, kept OUT of `dev` on purpose. `qb-board
# --follow` and the tail half must import neither, and the way that claim stays
# true is that the ordinary test run does not have them installed — the same
# reasoning mcp/pyproject.toml already uses for its own `tui`. The harness job
# runs the suite both ways.
tui = [
    "textual",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Named explicitly so a bare `pytest` loads tests/conftest.py as an *initial*
# conftest — which is what lets it announce the database it is about to rebuild
# before collection starts, rather than after. It also keeps a bare run off
# harness/, which carries its own suite with its own conventions.
testpaths = ["tests"]
asyncio_mode = "auto"
# One shared event loop for the whole session so the module-level async engine's
# connection pool isn't torn down under a closed loop between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",   # line-too-long (handled by formatter)
    # Every one of the 73 is deliberate. 54 are `＋` (FULLWIDTH PLUS) and 12 are `×`,
    # which the dashboards use because they line up in a monospace column where `+`
    # and `x` do not; the rest are an en dash, a curly apostrophe, and — the one that
    # looks most like a bug and is the most deliberate of all — `٧` (ARABIC-INDIC
    # SEVEN) as a test vector for "only a positive integer gets through". A rule that
    # is right about homoglyph attacks in identifiers has nothing to say about a
    # codebase whose strings and prose are typeset.
    "RUF001", "RUF002", "RUF003",   # ambiguous-unicode-character
    # `report, payload, seen = _round(...)` names what the tuple holds, and a test
    # that reads two of the three is not improved by renaming the third to `_seen`.
    # 76 of these, nearly all in tests, where the unpacking IS the documentation.
    "RUF059", # unused-unpacked-variable
    # This repo writes `# noqa: BLE001 — the claim is what must survive` and
    # `# noqa: PLC0415 — see docstring`: suppressions for a STRICTER selection than
    # the one above, carrying the reason in prose beside the code. RUF100 calls every
    # one of them unused, and `--fix` deletes them — losing the suppression and the
    # sentence explaining it, and re-breaking the file for anyone who does select
    # those rules. The convention is deliberate; the rule that objects to it is not
    # worth the convention. (Also 326 `# noqa: E402` in harness/, which ruff tolerates
    # and pycodestyle does not — same argument, different linter.)
    "RUF100", # unused-noqa

    # ---- TEMPORARY, and tracked: prisonblues/quarterback#697 ----------------
    # The 97 findings #47 could not fix mechanically. Every one needs a judgement a
    # `--fix` cannot make, and several are traps: `ruff check --fix` twice deleted
    # `import _path_sandbox`, which is imported for the side effect of building a
    # suite's PATH and HOME, and only a guard test noticed.
    #
    # They are ignored BY CODE rather than left as a red baseline so the gate in
    # `.github/workflows/tests.yml` can be a real gate today — it is live for every
    # other rule, which is what would have caught #34's `ci_txt ={"PASS": …`. This
    # block is a ratchet, not a clean bill: whittle it down in #697 and delete the entries
    # as they reach zero.
    "F401",   # unused-import — several are side-effecting; read each one
    "E741",   # ambiguous-variable-name — `l` for "line"
    "RUF015", # unnecessary-iterable-allocation-for-first-element
    "RUF005", # collection-literal-concatenation
    "SIM105", # suppressible-exception
    "UP031",  # printf-string-formatting
    "B905",   # zip-without-explicit-strict — real; `strict=` is a question per site
    "B904",   # raise-without-from-inside-except
    "E402",   # module-import-not-at-top-of-file — the 4 real ones
    "RUF012", # mutable-class-default
    "E702",   # multiple-statements-on-one-line-semicolon
    "F811",   # redefined-while-unused — a bug shape, worth doing first
    "F841",   # unused-variable
    "RUF013", # implicit-optional
    "RUF046", # unnecessary-cast-to-int
    "B023",   # function-uses-loop-variable — a bug shape, worth doing first
    "RUF017", # quadratic-list-summation
]

# `harness/` used to be excluded wholesale (#47). It is the most-edited code in the
# repo — `panel.py` above all — and the exclusion meant the cheapest possible class
# of defect was being caught by the most expensive possible reviewer: `ci_txt ={…`,
# a missing space with the continuation left at its old indent, reached review on #34
# because no tool was looking. One per-file entry buys the whole directory instead.
[tool.ruff.lint.per-file-ignores]
# The panel is split across modules that re-export each other's names by design — every
# one of these files already carries `# noqa: F401,F403` on the star import itself. F405
# is the same architecture seen from the other end ("may be undefined, or from a star
# import"), 802 times, and silencing it here is consistent with the suppression that is
# already on the import. Replacing the star imports is a refactor of the most-edited
# file in the repo and is not this issue.
#
# RUF022 belongs with it. These `__all__` lists are grouped by MEANING — the imports
# together, then the constants by theme — under a comment saying so, and the whole point
# of the grouping is that a reader can see what kind of thing each block is. Sorting them
# flat alphabetical is 257 lines of churn in panel_core alone, and what it buys is a list
# nobody can skim. Alphabetical is the better default for a list nobody reads; these are
# read.
"harness/loops/panel*.py" = ["F405", "RUF022"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
